/* ==========================================================================

.hero {
  position: relative;
  padding-block: 80px;
  color: var(--white);
}
/* Fundo e véu ficam fora do .hero (ver template.html), fixos à janela: o card de cotação
   pode crescer à vontade por dentro do hero (trocar de aba, abrir o modo documento) que a
   foto não reamostra nem corta, porque o tamanho dela vem do viewport, não do conteúdo. Como
   cobre 100% da tela o tempo todo, nunca sobra pedaço sem imagem, e as seções depois do hero
   (com fundo opaco próprio) cobrem normalmente por cima. Ficar fora do .hero, sem overflow
   nem isolation no caminho, evita um bug de composição que quebrava o desfoque do header.
   O deslocamento em --parallax-y (app.js, no scroll) é o que dá o movimento; sem JS a foto
   fica parada, só um pouco ampliada (scale) pra sobrar margem de sobra em qualquer direção. */
.hero__bg { position: fixed; inset: 0; z-index: -10; overflow: hidden; }
.hero__bg .media { transform: scale(1.15) translateY(var(--parallax-y, 0px)); will-change: transform; }
.hero__overlay {
  position: fixed; inset: 0; z-index: -9;
  background:
    linear-gradient(217.5deg, rgba(0,0,0,.6) 1.54%, rgba(0,0,0,0) 104.1%),
    linear-gradient(180deg, rgba(28,50,64,.8) 0%, rgba(102,102,102,0) 100%);

.step { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); }
.step__num {

  background: var(--orange); color: var(--white);
  font: 600 16px/22.5px var(--font-body);
  transition: filter .15s ease, transform .15s ease;
}
.quote__submit .icon { width: 16px; height: 16px; }
.quote__submit:hover { filter: brightness(1.05); }
.quote__submit:active { transform: translateY(1px); }
.quote__submit[disabled] { opacity: .7; cursor: progress; }
.quote__proof { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.proof { display: flex; align-items: center; gap: 20px; }
.avatars { display: flex; height: 44px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden; position: relative;
  box-shadow: 0 0 0 4px var(--ring); background: var(--surface);
}
.avatar + .avatar { margin-left: -12px; }
.avatar .media { position: absolute; }
.proof__meta { display: flex; flex-direction: column; gap: 8px; }
.stars { display: flex; gap: 4px; }
.stars .icon { width: 14px; height: 14px; }
.proof__text { font: 400 16px/18px var(--font-body); color: var(--ink2-65); }
.quote__error { width: 100%; font: 500 13px/18px var(--font-body); color: var(--red); display: none; }
.quote__error.is-visible { display: block; }

/* --- modo de envio: digitar os dados ou mandar um documento ---
   Secundário de propósito: o par Para você/Empresa acima é a escolha principal (.quote__tabs,
   caixa cheia). Este é sublinhado, mesmo padrão das .dtabs de conteúdo, mas cada aba ocupa
   metade da largura do cartão (flex:1), acompanhando o traço embaixo de ponta a ponta. */
.quote__field--modo { gap: 20px; }
.modetabs { display: flex; gap: 24px; margin: 0; padding: 0; border: 0; border-bottom: 1px solid var(--line); }
.modetab { flex: 1 1 0; min-width: 0; position: relative; padding-bottom: 12px; cursor: pointer; }
.modetab span {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font: 500 15px/20px var(--font-body); color: var(--ink-60);
  transition: color .15s ease;
}
.modetab input { position: absolute; opacity: 0; pointer-events: none; }
.modetab:hover span { color: var(--ink); }
.modetab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: transparent; transition: background-color .15s ease;
}
.modetab:has(input:checked) span { color: var(--ink); font-weight: 600; }
.modetab:has(input:checked)::after { background: var(--orange); }
.modetab input:focus-visible ~ span { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 2px; }
.modetab__tag {
  padding: 2px 8px; border-radius: 999px; background: var(--peach); color: var(--orange);
  font: 600 11px/16px var(--font-body); letter-spacing: .01em; white-space: nowrap;
}
/* na tela estreita as duas abas com a tag não cabem lado a lado: viram cartões empilhados,
   com anel para marcar o selecionado no lugar do traço inferior */
@media (max-width: 639px) {
  .modetabs { flex-direction: column; gap: 10px; border-bottom: 0; }
  .modetab {
    padding: 13px 14px; border-radius: var(--r-sm); background: var(--surface);
    transition: background-color .15s ease, box-shadow .15s ease;
  }
  .modetab span { justify-content: space-between; }
  .modetab::after { display: none; }
  .modetab:has(input:checked) { background: var(--white); box-shadow: 0 0 0 1.5px var(--orange) inset; }
}
/* introdução do modo documento: só título (a intenção, em poucas palavras) e descrição (um
   pouco mais de detalhe, mas enxuta). Sem rótulo acima. */
.doc__intro { display: flex; flex-direction: column; gap: 6px; }
.doc__title { font: 600 17px/23px var(--font-display); letter-spacing: -.01em; color: var(--ink); }
.doc__hint { font: 400 14px/21px var(--font-body); color: var(--ink-65); }
/* campos exclusivos de cada modo */
.quote:not(.is-doc) [data-only="documento"], .quote.is-doc [data-only="dados"] { display: none; }
.quote.is-doc .quote__row { grid-template-columns: 1fr; }

.quote__doc { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.quote__doc[hidden] { display: none; }
/* zona de envio compacta: ícone, texto e ação numa só linha */
.doc__drop {
  display: flex; align-items: center; gap: 16px; padding: 16px 16px 16px 20px;
  border: 1.5px dashed rgba(33,34,34,.2); border-radius: var(--r-md);
  transition: border-color .15s ease, background .15s ease;
}
.doc__drop.is-over { border-color: var(--orange); background: var(--peach); }
.doc__drop-icon { flex: none; width: 20px; height: 20px; color: var(--orange); }
.doc__drop-copy { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.doc__drop-copy strong { font: 600 15px/20px var(--font-body); color: var(--ink); }
.doc__drop-actions { flex: none; display: flex; align-items: center; gap: 8px; }
.doc__btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap;
  background: var(--white); border: 1px solid var(--line); color: var(--ink); font: 600 14px/18px var(--font-body);
  transition: background .15s ease;
}
.doc__btn:hover { background: #EBEBED; }
.doc__btn:focus-within { outline: 2px solid var(--orange); outline-offset: 2px; }
.doc__btn--camera { padding: 10px; }
.doc__btn--camera .icon { width: 18px; height: 18px; color: var(--orange); }
/* "Tirar foto" só faz sentido onde há câmera: telas de toque */
@media (pointer: fine) { .doc__btn--camera { display: none; } }
.doc__meta { font: 400 12px/17px var(--font-body); color: var(--ink-65); }
@media (max-width: 639px) {
  .doc__drop { flex-wrap: wrap; }
  .doc__drop-actions { width: 100%; }
  .doc__drop-actions .doc__btn:not(.doc__btn--camera) { flex: 1 1 auto; }
}
.doc__list { display: flex; flex-direction: column; gap: 8px; }
.doc__list:empty { display: none; }
.doc__item { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 8px; border-radius: 12px; background: var(--surface); }
.doc__thumb { flex: none; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--white); color: var(--orange); }
.doc__thumb img { width: 100%; height: 100%; object-fit: cover; }
.doc__thumb svg { width: 22px; height: 22px; }
.doc__info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.doc__name { font: 500 13px/18px var(--font-body); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc__size { font: 400 12px/16px var(--font-body); color: var(--ink-65); }
.doc__bar { height: 3px; border-radius: 2px; background: rgba(0,0,0,.08); overflow: hidden; }
.doc__bar span { display: block; height: 100%; width: 0; background: var(--orange); transition: width .2s ease; }
.doc__item:not(.is-sending):not(.is-sent) .doc__bar { display: none; }
.doc__remove { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-65); }
.doc__remove:hover { background: #E6E6E8; color: var(--ink); }
.doc__remove svg { width: 16px; height: 16px; }

.quote__consent { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font: 400 13px/19px var(--font-body); color: var(--ink-65); }
.quote__consent input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--orange); }
.quote__consent a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.quote__consent.is-invalid span { color: var(--red); }

/* armadilha para robôs: fora da tela, fora do leitor de tela */
.quote__hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.quote__success {
  display: none; width: 100%; text-align: center; padding: 24px 8px;
  flex-direction: column; align-items: center; gap: 12px;
}
.quote.is-done > :not(.quote__success) { display: none; }
.quote.is-done .quote__success { display: flex; }
.quote__success .badge { width: 56px; height: 56px; border-radius: 50%; background: var(--peach); display: grid; place-items: center; }
.quote__success .badge .icon { width: 28px; height: 28px; }
.quote__success h3 { font: 700 24px/1.2 var(--font-display); letter-spacing: -.02em; }
.quote__success p { color: var(--ink-65); max-width: 46ch; }
.quote__success button { margin-top: 8px; color: var(--orange); font-weight: 600; }
@media (max-width: 767px) {
  .quote { padding: 20px; gap: 20px; border-radius: 20px; }
  .quote__tab { font-size: 14px; padding: 10px 8px; }
  .quote__row { grid-template-columns: 1fr; gap: 16px; }
  .quote__inputs { gap: 16px; }
  .proof { flex-direction: column; gap: 12px; }
  .proof__meta { align-items: center; }
}

/* ==========================================================================
   SEGURADORAS PARCEIRAS
   ========================================================================== */
.partners {
  background: var(--surface); border-top: 1px solid var(--line-faint);
  padding-block: 48px;
}
.partners__label {
  text-align: center;
  font: 700 12px/18px var(--font-body); letter-spacing: 3px; text-transform: uppercase;
  color: var(--ink-55);
}
.logos {
  display: flex; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
}
.logos__track { display: flex; align-items: center; flex-shrink: 0; margin: 0; padding: 0; list-style: none; animation: logos 48s linear infinite; }
.logos:hover .logos__track { animation-play-state: paused; }
.seg { display: flex; align-items: center; justify-content: center; height: 40px; padding-inline: 32px; }
.seg-logo { display: block; height: 32px; width: auto; max-width: 140px; object-fit: contain; filter: grayscale(1); opacity: .6; transition: filter .3s ease, opacity .3s ease; }
.seg:hover .seg-logo { filter: none; opacity: 1; }
.seg-name { font: 600 19px/1 var(--font-display); letter-spacing: -.02em; color: var(--ink-55); white-space: nowrap; transition: color .3s ease; }
.seg:hover .seg-name { color: var(--ink); }
@keyframes logos { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) {
  .logos { overflow-x: auto; scrollbar-width: none; }

}
@media (max-width: 767px) { .partners { padding-block: 32px; } .seg { padding-inline: 22px; } .seg-name { font-size: 17px; } }

/* ==========================================================================
   PARA VOCÊ
   ========================================================================== */
.pv { background: var(--white); }
.pv__inner { display: flex; flex-direction: column; gap: 40px; }
.section-head { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.h2 { font: 600 clamp(36px, 5.5vw, 60px)/1 var(--font-alt); letter-spacing: -.04em; color: var(--ink); text-wrap: balance; }
.h2 .accent { color: var(--orange); }
.lead { font: 400 19px/1.375 var(--font-body); color: var(--ink-65); text-wrap: balance; }
.pv__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 200px; gap: 12px; margin-top: 16px; }
.pv-hero {

.pv-hero__title span { display: block; font-weight: 500; }
.pv-hero__link { margin-top: 16px; display: inline-flex; align-items: center; gap: 4px; font: 600 13px/19.5px var(--font-body); }
.pv-hero__link .icon { width: 16px; height: 16px; margin: 0; }
.pv-hero:hover .media { transform: scale(1.03); }
.pv-hero .media { transition: transform .5s ease; }
.pv-card {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 25px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line);
  text-align: left; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.pv-card:hover { transform: translateY(-2px); border-color: rgba(255,100,0,.35); box-shadow: 0 12px 30px -18px rgba(0,0,0,.3); }
.pv-card .icon { width: 24px; height: 24px; }
.pv-card__title { font: 600 20px/30px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.pv-card__text { margin-top: 4px; font: 500 13px/19.5px var(--font-body); color: var(--ink-60); }
.pv-card--round { border-radius: var(--r-lg); }
.pv-card--dark { background: var(--navy); border-color: var(--navy); color: var(--white); padding: 24px; border-radius: var(--r-lg); }
.pv-card--dark .pv-card__title { color: var(--white); }
.pv-card--dark .pv-card__text { color: var(--orange); font-weight: 600; margin-top: 8px; }
.pv-card--dark:hover { border-color: var(--orange); }
@media (max-width: 1023px) {
  .pv__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 599px) {
  .pv__grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .pv-hero { grid-column: 1; grid-row: auto; width: 100%; min-width: 0; aspect-ratio: 560 / 412; }
  .pv-card { min-height: 132px; padding: 20px; }
  .pv-card .icon { width: 24px; height: 24px; }
  .pv-hero__title { font-size: 32px; }
}

/* ==========================================================================
   EMPRESA
   ========================================================================== */
.emp {

    linear-gradient(219.6deg, rgba(0,0,0,.6) 1.54%, rgba(0,0,0,0) 104.1%),
    var(--navy);
}

.emp-card__num { font: 500 11px/16.5px var(--font-body); letter-spacing: .05em; color: var(--white-40); }
.emp-card__title { font: 600 18px/27px var(--font-display); letter-spacing: -.02em; color: var(--white); }
.emp-card__text { margin-top: 6px; font: 500 13px/21px var(--font-body); color: var(--white-60); }
@media (max-width: 1023px) {

}

}

/* ==========================================================================
   NOSSA HISTÓRIA
   ========================================================================== */
.hist {
  color: var(--white);
  padding-block: 96px;
  background: linear-gradient(182.74deg, var(--red) 7.26%, var(--orange) 70.8%);
}
.hist__inner { display: flex; flex-direction: column; align-items: center; gap: 56px; }
.hist__head { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.hist__h2 { font: 700 clamp(40px, 7.5vw, 88px)/.95 var(--font-display); letter-spacing: -.045em; color: var(--white); text-wrap: balance; max-width: 1232px; }
.hist__h2 .num { font-weight: 500; }
.hist__lead { font: 400 18px/1.375 var(--font-body); color: var(--white-85); max-width: 1097px; text-wrap: balance; }
.video {
  position: relative; width: 100%; max-width: 1024px; aspect-ratio: 2 / 1;
  border-radius: var(--r-lg); overflow: hidden; isolation: isolate;
  background: var(--deep); display: block; text-align: left;
}
.video .media, .video .ph { z-index: -2; }

.video__title { font: 600 24px/36px var(--font-display); letter-spacing: -.02em; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
@media (max-width: 767px) {
  .hist { padding-block: 64px; }
  .hist__inner { gap: 32px; }
  .video__caption { left: 16px; right: 16px; bottom: 16px; }
  .video__title { font-size: 18px; line-height: 26px; }
  .video__play { width: 60px; height: 60px; }
}

/* ==========================================================================
   ASSISTENTE ALTA
   ========================================================================== */
.alta {
  position: relative; overflow: hidden;   /* contém a cauda do balão, que sai 27px pra direita */
  color: var(--ink); background: var(--white);
  padding-block: 112px;
}
.alta .eyebrow .plain { color: var(--ink); }   /* a base do .eyebrow assume fundo escuro */
.alta__inner { display: grid; grid-template-columns: minmax(0, 592fr) minmax(0, 542fr); gap: clamp(32px, 6vw, 72px); align-items: start; }
.alta__copy { display: flex; flex-direction: column; gap: 32px; padding-top: 30px; }
.alta__head { display: flex; flex-direction: column; gap: 24px; }
.alta__h2 { font: 700 clamp(32px, 4.5vw, 48px)/1.05 var(--font-display); letter-spacing: -.03em; color: var(--ink); text-wrap: balance; }
.alta__h2 .accent { color: var(--orange); }
.alta__lead { font: 400 16px/26px var(--font-body); color: var(--ink-65); max-width: 512px; }
.alta__copy .alta-inline { max-width: 540px; }
.alta__wa { align-self: flex-start; margin-top: -16px; font: 500 14px/20px var(--font-body); color: var(--ink-65); text-decoration: underline; text-underline-offset: 3px; }

.chat { display: flex; flex-direction: column; gap: 16px; padding-top: 58px; }
.chat__user {
  align-self: flex-end; position: relative;
  max-width: calc(100% - 28px); padding: 16px;
  border-radius: var(--r-sm); border-top-right-radius: 0;   /* o canto some dentro da cauda */

  font: 600 14px/20px var(--font-body);
}
/* cauda: o SVG já sai do Figma na orientação certa — sem transform */

.chat__user .tail svg { display: block; width: 28px; height: 25px; }
.chat__alta {
  position: relative; padding: 15px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--line);
}
.chat__name { font: 400 12px/16px var(--font-body); color: var(--ink-65); }
.chat__msg { margin-top: 4px; font: 400 14px/20px var(--font-body); color: var(--ink); }
.chat__quick { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }

  padding: 8px 16px; height: 32px; border-radius: 999px;

@media (max-width: 1023px) {

  .alta__copy { padding-top: 0; }

/* ==========================================================================
   CTA FINAL
   ========================================================================== */
.final {
  position: relative; isolation: isolate; overflow: hidden;
  color: var(--white); background: var(--deep);
  padding-block: 80px;
}
.final__bg { position: absolute; inset: 0; z-index: -2; }
.final__bg .media { object-position: 70% center; transform: scale(1.16) translateY(var(--parallax-y, 0px)); will-change: transform; }
.final__overlay { position: absolute; inset: 0; z-index: -1; background: linear-gradient(75.27deg, #0D171D 34.4%, rgba(0,0,0,0) 75.18%); }
.final__inner { display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
.final .eyebrow { font-size: 18px; }
.final .quote { max-width: 745px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.15); }
@media (max-width: 1023px) {
  .final__overlay { background: linear-gradient(180deg, rgba(13,23,29,.92) 0%, rgba(13,23,29,.75) 60%, rgba(13,23,29,.55) 100%); }
  .final .quote { max-width: 100%; }
}
@media (max-width: 767px) { .final { padding-block: 56px; } }

/* ==========================================================================
   FOOTER
   ========================================================================== */
.footer { background: var(--surface-2); color: var(--ink); }
.footer__legal { background: var(--white); border-bottom: 1px solid var(--line); padding-block: 24px; }
.footer__legal p { font: 400 12px/19.5px var(--font-body); color: var(--black-60); max-width: 1319px; margin-inline: auto; }
.footer__wide { max-width: 1319px; margin-inline: auto; padding-inline: var(--gutter); }
.footer__main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 40px; padding-block: 64px; }
.footer__brand { display: flex; flex-direction: column; gap: 20px; }
.footer__logo { width: min(245px, 70vw); }
.footer__logo svg { width: 100%; height: auto; }
.footer__brand p { font: 400 14px/22.75px var(--font-body); color: var(--black-60); max-width: 278px; }
.social { display: flex; gap: 12px; }
.social a { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.1); display: grid; place-items: center; transition: background .15s ease; }
.social a:hover { background: rgba(0,0,0,.16); }
.social .icon { width: 16px; height: 16px; }
/* a coluna de contato cresce até o e-mail caber inteiro */
.footer__cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(max-content, 1fr); gap: 40px; }
.footer__col h3 { font: 400 14px/20px var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--black-40); }
.footer__col ul { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.footer__col a { font: 400 14px/20px var(--font-body); color: var(--black-80); }
.footer__col a:hover, .footer__col a[aria-current] { color: var(--orange); }
.footer__bottom { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 24px; font: 400 12px/16px var(--font-body); color: var(--black-40); }
.footer__bottom a:hover { color: var(--ink); }
@media (max-width: 1023px) { .footer__main { grid-template-columns: 1fr; gap: 48px; } }
@media (min-width: 600px) and (max-width: 899px) { .footer__cols { grid-template-columns: 1fr 1fr; gap: 40px 32px; } }
@media (max-width: 599px) { .footer__cols { grid-template-columns: 1fr 1fr; gap: 32px 20px; } .footer__main { padding-block: 40px; } }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px);
  z-index: 100; padding: 12px 18px; border-radius: 12px;
  background: var(--ink); color: var(--white); font: 500 14px/20px var(--font-body);
  box-shadow: 0 12px 30px -10px rgba(0,0,0,.4);
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  max-width: calc(100vw - 32px);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ==========================================================================
   PÁGINA DE PRODUTO
   ========================================================================== */
.crumbs { background: var(--surface-2); border-bottom: 1px solid var(--line-faint); }
.crumbs ol { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 12px 0; }
.crumbs li { font: 400 12px/18px var(--font-body); color: var(--ink-50); }
.crumbs li + li::before { content: "/"; margin-right: 8px; color: var(--ink-50); }
.crumbs a { color: var(--ink-70); }
.crumbs a:hover { color: var(--orange); }

.prod-sec--dark { background: var(--navy); color: var(--white); }
.prod-split { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 72px; align-items: start; }

.prod-narrow > * { max-width: 820px; }   /* alinha à esquerda, como as demais seções */
.prod-lead { margin-top: 18px; font: 400 17px/28px var(--font-body); color: var(--ink-60); }
.prod-lead--white { color: var(--white-70); }
.prod-note {
  margin-top: 32px; padding-left: 18px; border-left: 2px solid var(--orange);
  font: 400 15px/24px var(--font-body); color: var(--ink-60); max-width: 74ch;
}
.prod-note strong { color: var(--ink); font-weight: 600; }

/* Ícones: glifo puro, sem selo colorido atrás */
.cov__icon, .rel__icon { display: block; flex: none; color: var(--orange); }
.cov__icon { width: 26px; height: 26px; }
.rel__icon { width: 24px; height: 24px; }
.cov__icon svg, .rel__icon svg { width: 100%; height: 100%; }

.cov { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cov__item {
  padding: 28px 26px; border-radius: 20px; background: var(--surface-2);
  transition: background .18s ease;
}
.cov__item:hover { background: #EFEFF1; }
.cov__item h3 { margin-top: 20px; font: 600 17px/23px var(--font-body); letter-spacing: -.01em; color: var(--ink); }
.cov__item p { margin-top: 10px; font: 400 14px/22px var(--font-body); color: var(--ink-60); }

.exc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 24px; list-style: none; }
.exc li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
.exc__icon { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--orange-light); }
.exc__icon svg { width: 100%; height: 100%; }
.exc__txt { display: flex; flex-direction: column; gap: 3px; }
.exc strong { font: 600 15px/21px var(--font-body); color: var(--white); }
.exc__txt > span { font: 400 13px/19px var(--font-body); color: var(--white-60); }

.price { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.price__col { padding: 30px 28px; border-radius: 20px; background: var(--white); }
.price__col h3 { display: flex; align-items: center; gap: 10px; font: 600 18px/24px var(--font-display); color: var(--ink); }
.price__icon { display: block; flex: none; width: 22px; height: 22px; color: var(--orange); }
.price__icon svg { width: 100%; height: 100%; }
.price__col ul { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; list-style: none; }
.price__col li { position: relative; padding-left: 20px; font: 400 14px/21px var(--font-body); color: var(--ink-65); }
.price__col li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

.faq { margin-top: 32px; border-top: 1px solid var(--line); }
.faq__item { border-bottom: 1px solid var(--line); }
.faq__item summary {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 20px 0; cursor: pointer; list-style: none;
  font: 600 16px/24px var(--font-body); color: var(--ink);
}
.faq__item summary::-webkit-details-marker { display: none; }
.faq__item summary::after {
  content: ""; flex: none; width: 10px; height: 10px;
  border-right: 2px solid var(--ink-50); border-bottom: 2px solid var(--ink-50);
  transform: translateY(-3px) rotate(45deg); transition: transform .18s ease;
}
.faq__item[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.faq__item summary:hover { color: var(--orange); }
.faq__item p { padding-bottom: 22px; font: 400 15px/25px var(--font-body); color: var(--ink-65); max-width: 70ch; }

.rel { margin-top: 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.rel__item {
  display: flex; flex-direction: column; gap: 4px; padding: 26px 24px;
  border-radius: 20px; background: var(--white);
  transition: box-shadow .18s ease, transform .18s ease;
}
.rel__item:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 18px 36px -20px rgba(0,0,0,.22); }
.rel__item .rel__icon { margin-bottom: 14px; }
.rel__item strong { font: 600 16px/22px var(--font-body); color: var(--ink); }
.rel__item span { font: 400 13px/19px var(--font-body); color: var(--ink-50); }

@media (max-width: 1023px) {
  .prod-split { grid-template-columns: 1fr; gap: 40px; }
  .cov { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .cov, .price, .exc, .rel { grid-template-columns: 1fr; }
}

/* ==========================================================================
   PRODUTO EDITORIAL (referência: páginas de produto da Apple)
   Navegação local fixa, títulos grandes centralizados, galeria horizontal.
   ========================================================================== */
/* com navegação local, o header some ao descer e volta ao subir (.hdr-hidden no <html>, via app.js).
   A barra do produto acompanha: fica logo abaixo do header ou encosta no topo. */
body:has(.lnav) .header { transition: transform .3s cubic-bezier(.4,0,.2,1); }
.hdr-hidden body:has(.lnav) .header { transform: translateY(calc(-100% - env(safe-area-inset-top, 0px))); }
.px [id] { scroll-margin-top: 124px; }

.lnav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); z-index: 45;
  transition: top .3s cubic-bezier(.4,0,.2,1);
  background: rgba(255,255,255,.82);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line-soft);
}
.lnav__inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 52px; }
.lnav__title { font: 600 19px/1 var(--font-display); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.lnav__menu { display: flex; align-items: center; gap: 28px; }
.lnav__links { display: flex; gap: 24px; }
.lnav__links a { font: 400 13px/1 var(--font-body); color: var(--ink-70); white-space: nowrap; }
.lnav__links a:hover { color: var(--ink); }
/* oculto, o botão tem largura zero e a margem negativa anula o gap: os links ocupam a direita.
   Ao aparecer, ele cresce e empurra os links para a esquerda. visibility o tira da tabulação. */
.lnav__cta {
  display: inline-flex; align-items: center; justify-content: center; height: 30px; border-radius: 15px; cursor: pointer;
  background: var(--orange); color: var(--white);
  font: 600 13px/1 var(--font-body); white-space: nowrap; overflow: hidden;
  max-width: 0; padding: 0; margin-left: -28px;
  opacity: 0; visibility: hidden;
  transition: max-width .35s cubic-bezier(.4,0,.2,1), padding .35s cubic-bezier(.4,0,.2,1), margin .35s cubic-bezier(.4,0,.2,1),
              opacity .2s ease, visibility 0s linear .35s, filter .15s ease;
}
.hdr-hidden .lnav { top: env(safe-area-inset-top, 0px); }
.hdr-hidden .lnav__cta {
  max-width: 120px; padding: 0 16px; margin-left: 0;
  opacity: 1; visibility: visible;
  transition: max-width .35s cubic-bezier(.4,0,.2,1), padding .35s cubic-bezier(.4,0,.2,1), margin .35s cubic-bezier(.4,0,.2,1),
              opacity .25s ease .1s, visibility 0s, filter .15s ease;
}
.lnav__cta:hover { filter: brightness(1.05); }
@media (prefers-reduced-motion: reduce) {
  body:has(.lnav) .header, .lnav, .lnav__cta, .hdr-hidden .lnav__cta { transition: none; }
}
@media (max-width: 859px) { .lnav__links { display: none; } }

.crumbs--plain { background: transparent; border: 0; }

.px-hero { padding-block: 40px 0; text-align: center; }
.px-hero .eyebrow { margin-bottom: 8px; }
.px-hero__h1 {
  font: 700 clamp(46px, 8.4vw, 108px)/.98 var(--font-display);
  letter-spacing: -.05em; color: var(--ink); text-wrap: balance;
}
.px-hero__h1 .accent { display: block; color: var(--orange); }
.px-hero__lead {
  margin: 28px auto 0; max-width: 44ch; text-wrap: balance;
  font: 500 clamp(19px, 2.1vw, 26px)/1.35 var(--font-display); letter-spacing: -.015em; color: var(--ink-65);
}
.px-hero__ctas { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px 32px; }
.px-hero__note { margin-top: 20px; font: 400 14px/20px var(--font-body); color: var(--ink-65); }
.px-hero__media { position: relative; margin-top: 64px; aspect-ratio: 16 / 7; border-radius: 28px; overflow: hidden; }

.px-btn {
  display: inline-flex; align-items: center; justify-content: center; height: 50px; padding: 0 28px; border-radius: 25px;
  background: var(--orange); color: var(--white);
  font: 600 17px/1 var(--font-body); transition: filter .15s ease, transform .15s ease;
}
.px-btn:hover { filter: brightness(1.05); }
.px-btn:active { transform: translateY(1px); }
.px-link { display: inline-flex; align-items: center; gap: 2px; font: 500 17px/1 var(--font-body); color: var(--ink); }
.px-link .icon { width: 18px; height: 18px; color: var(--orange); transition: transform .15s ease; }
.px-link:hover .icon { transform: translateX(3px); }

.px-sec { padding-block: 128px; }
.px-sec--soft { background: var(--surface); }
.px-sec--deep { background: var(--deep); color: var(--white); }
.px-sec--flush { overflow: hidden; }
.px-head { max-width: 860px; margin: 0 auto 72px; text-align: center; }
.px-head .px-lead { max-width: 60ch; margin-inline: auto; }
.px-label { margin-bottom: 14px; font: 600 18px/1.2 var(--font-display); letter-spacing: -.01em; color: var(--ink); }
.px-label--white { color: var(--white); }
.px-h2 {
  font: 700 clamp(38px, 5.8vw, 76px)/1.02 var(--font-display);
  letter-spacing: -.045em; color: var(--ink); text-wrap: balance;
}
.px-h2 .accent { display: block; color: var(--orange); }
.px-h2--md { font-size: clamp(32px, 4.2vw, 52px); line-height: 1.06; letter-spacing: -.04em; }
.px-h2--md .accent { display: inline; }
.px-h2--white { color: var(--white); }
.px-h2--white .accent { color: var(--orange-light); }
.px-lead { margin-top: 24px; font: 400 clamp(17px, 1.5vw, 20px)/1.55 var(--font-body); color: var(--ink-65); }
.px-lead--white { color: var(--white-70); }
.px sup { font-size: .6em; line-height: 0; vertical-align: super; }
.fn { color: inherit; opacity: .8; padding-inline: 1px; }
.fn:hover { color: var(--orange); opacity: 1; }

/* --- galeria de destaques: rola de ponta a ponta, primeiro card alinhado ao container --- */
.hl__track {
  --edge: max(var(--gutter), calc((100% - var(--container)) / 2 + var(--gutter)));
  display: flex; gap: 20px; margin-top: 48px;
  padding-inline: var(--edge); scroll-padding-inline: var(--edge);
  overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  scrollbar-width: none; list-style: none;
}
.hl__track::-webkit-scrollbar { display: none; }
.hl__card {
  position: relative; isolation: isolate; overflow: hidden;
  flex: 0 0 min(380px, 80vw); min-height: 500px; scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 36px;
  border-radius: 20px; background: var(--surface-2); color: var(--white);
}
.hl__media { position: absolute; inset: 0; z-index: -2; }
.hl__media .media { border-radius: 0; }
.hl__card::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.32) 45%, rgba(0,0,0,.05) 75%);
}
.hl__kicker { font: 600 13px/18px var(--font-body); color: var(--white-70); }
.hl__text { margin-top: 12px; font: 600 24px/1.3 var(--font-display); letter-spacing: -.02em; color: var(--white-80); }
.hl__text strong { font-weight: 700; color: var(--white); }
.hl__nav { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
.hl__btn {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: var(--orange); color: var(--white); transition: filter .15s ease, opacity .15s ease;
}
.hl__btn svg { width: 22px; height: 22px; }
.hl__btn:hover:not(:disabled) { filter: brightness(1.06); }
.hl__btn:disabled { opacity: .4; cursor: default; }

/* --- números grandes --- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px; text-align: center; }
.stat__pre { font: 500 17px/24px var(--font-body); color: var(--white-70); }
.stat__num { margin-top: 6px; font: 700 clamp(52px, 6.4vw, 84px)/1 var(--font-display); letter-spacing: -.05em; color: var(--orange-light); white-space: nowrap; }
.stat__txt { margin: 14px auto 0; max-width: 28ch; font: 400 16px/25px var(--font-body); color: var(--white-70); }

/* seção clara: cards brancos */
.px-sec--soft .cov__item { background: var(--white); }
.px-sec--soft .cov__item:hover { background: var(--white); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 18px 36px -20px rgba(0,0,0,.22); }
.px-sec--soft .rel { margin-top: 40px; }
.price--gray .price__col { background: var(--surface-2); }

/* --- abas por destino: texto sublinhado, sem pílula --- */
.dtabs__list {
  display: flex; justify-content: center; gap: 36px; margin-bottom: 64px;
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.dtabs__list::-webkit-scrollbar { display: none; }
.dtabs__tab {
  flex: none; padding: 0 0 16px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  font: 600 16px/20px var(--font-body); color: var(--ink-60); white-space: nowrap;
  transition: color .15s ease, border-color .15s ease;
}
.dtabs__tab:hover { color: var(--ink); }
.dtabs__tab[aria-selected="true"] { color: var(--ink); border-color: var(--orange); }
.dtab { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 72px; align-items: start; }
.dtab[hidden] { display: none; }
.dtab h3 { font: 700 clamp(28px, 3.3vw, 40px)/1.1 var(--font-display); letter-spacing: -.035em; color: var(--ink); }
.dtab h3 + p { margin-top: 20px; font: 400 17px/28px var(--font-body); color: var(--ink-65); max-width: 52ch; }
.dtab__check { padding: 32px; border-radius: 20px; background: var(--surface-2); }
.dtab__label { font: 600 12px/16px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-65); }
.dtab__check ul { margin-top: 8px; }
.dtab__check li { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); font: 400 15px/23px var(--font-body); color: var(--ink-80); }
.dtab__check li:last-child { border-bottom: 0; padding-bottom: 0; }
.dtab__check .icon { width: 18px; height: 18px; margin-top: 2px; }

/* --- comparativo de planos --- */
/* subgrid: cada linha (nome, descrição, vigência...) alinha entre os três cards */
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 16px; }
.plan {
  display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 0;
  padding: 40px 32px 36px; border-radius: 20px; background: var(--white);
}
.plan dl { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 0; }
.plan__icon { display: block; width: 36px; height: 36px; color: var(--orange); }
.plan__icon svg { width: 100%; height: 100%; stroke-width: 1.4; }
.plan h3 { margin-top: 28px; font: 700 28px/1.1 var(--font-display); letter-spacing: -.035em; color: var(--ink); }
.plan__desc { margin-top: 10px; font: 400 15px/23px var(--font-body); color: var(--ink-65); }
/* em seção branca os cards voltam ao cinza; o recomendado se destaca por elevação */
.px-sec:not(.px-sec--soft) .plan { background: var(--surface-2); }
.px-sec .plan.plan--featured { background: var(--white); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 24px 48px -24px rgba(0,0,0,.28); }
.px-note { margin-inline: auto; margin-top: 40px; }
.plan dl { margin: 28px 0 0; border-top: 1px solid var(--line); }
.plan dl > div { padding-top: 20px; }
.plan dt { font: 600 12px/16px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-65); }
.plan dd { margin: 6px 0 0; font: 400 15px/23px var(--font-body); color: var(--ink-80); }

/* --- por que a Seguralta --- */
.why { margin-top: 48px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.why__item { padding: 32px 28px; border-radius: 20px; background: var(--surface-2); }
.why__icon { display: block; width: 28px; height: 28px; color: var(--orange); }
.why__icon svg { width: 100%; height: 100%; }
.why__item h3 { margin-top: 36px; font: 600 19px/25px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.why__item p { margin-top: 8px; font: 400 14px/22px var(--font-body); color: var(--ink-65); }

/* --- cotação --- */
.px-quote { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 72px; align-items: center; }
.px-quote .px-lead { max-width: 46ch; text-wrap: pretty; }
.px-marks { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
.px-marks li { display: flex; align-items: center; gap: 10px; font: 500 15px/21px var(--font-body); color: var(--ink-80); }
.px-marks .icon { width: 16px; height: 16px; }
.px .quote { scroll-margin-top: 96px; }

.px-end { text-align: center; padding-block: 120px; }
.px-end .px-lead { margin-inline: auto; }

.fnotes { padding-block: 40px; background: var(--surface); border-top: 1px solid var(--line-faint); }
.fnotes ol { padding-left: 18px; display: flex; flex-direction: column; gap: 10px; max-width: 980px; }
.fnotes li { font: 400 12px/19px var(--font-body); color: var(--ink-65); }
.fnotes li:target { color: var(--ink); }

@media (max-width: 1023px) {

/* ==========================================================================
   MODAL DE COTAÇÃO
   ========================================================================== */
.modal {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
  padding: 0; border: 0; border-radius: 24px;
  background: var(--white); color: var(--ink); overflow: visible;
}
.modal::backdrop { background: rgba(13,23,29,.55); backdrop-filter: blur(3px); }
.modal__panel { max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto; padding: 28px; }
.modal__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.modal__title { font: 700 24px/30px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.modal__close {
  flex: none; width: 34px; height: 34px; margin: -4px -4px 0 0;
  display: grid; place-items: center; border-radius: 50%; cursor: pointer;
  background: var(--surface-2); color: var(--ink-60); transition: background .15s ease, color .15s ease;
}
.modal__close svg { width: 17px; height: 17px; }
.modal__close:hover { background: #E8E8EA; color: var(--ink); }
/* dentro do modal o formulário não precisa do próprio cartão */
.modal .quote { max-width: none; padding: 0; border: 0; border-radius: 0; background: transparent; gap: 20px; }
@media (max-width: 599px) {
  .modal { width: 100%; max-width: none; max-height: 92vh; max-height: 92dvh; margin: auto auto 0; border-radius: 24px 24px 0 0; }
  .modal__panel { max-height: 92vh; max-height: 92dvh; padding: 24px 20px 28px; }
  .modal__title { font-size: 21px; line-height: 27px; }
}
@media (prefers-reduced-motion: no-preference) {
  .modal[open] { animation: modal-in .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
}

/* ==========================================================================
   ALTA (assistente): caixa central (spotlight) que vira painel lateral
   ========================================================================== */
/* --- entradas --- */
.nav__alta { display: inline-flex; align-items: center; gap: 6px; font: 400 14px/20px var(--font-body); color: var(--ink-80); white-space: nowrap; }
.nav__alta .icon { width: 16px; height: 16px; color: var(--orange); }
.nav__alta:hover { color: var(--ink); }
/* entre 1024 e 1199px o header aperta: fica só o ícone, o nome segue para leitor de tela */
@media (min-width: 1024px) and (max-width: 1199px) {
  .nav__alta span:last-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
@media (max-width: 1023px) {
  .nav__alta { width: 100%; font-size: 15px; line-height: 24px; padding: 12px 0; border-bottom: 1px solid var(--line-faint); }
}

.alta-inline {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 56px; padding: 0 8px 0 18px;
  border-radius: 28px; background: var(--white); border: 1px solid var(--line);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.alta-inline:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,100,0,.15); }
.alta-inline > .icon { width: 20px; height: 20px; color: var(--orange); }
.alta-inline input { flex: 1 1 auto; min-width: 0; height: 100%; border: 0; background: transparent; font: 400 16px/1 var(--font-body); color: var(--ink); }
.alta-inline input:focus { outline: none; }
.alta-inline input::placeholder { color: var(--ink-50); }
.alta-inline button, .alta-ui__send {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  background: var(--orange); color: var(--white); transition: filter .15s ease, opacity .15s ease;
}
.alta-inline button svg, .alta-ui__send svg { width: 20px; height: 20px; }

.alta-inline--dark input { color: var(--white); }
.alta-inline--dark input::placeholder { color: var(--white-60); }
.alta-inline--dark > .icon { color: var(--orange-light); }
.px-ask { margin-top: 48px; }
.px-ask__title { margin-bottom: 14px; font: 600 18px/1.3 var(--font-display); letter-spacing: -.01em; color: var(--ink); }

/* --- botão flutuante: destaque por elevação, some enquanto a Alta está aberta --- */
/* abaixo do fundo borrado do megamenu (48): fica desfocado junto com a página */
.alta-fab {
  position: fixed; z-index: 47;
  right: max(20px, env(safe-area-inset-right, 0px) + 16px); bottom: max(20px, env(safe-area-inset-bottom, 0px) + 16px);
  display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 24px;
  background: var(--white); color: var(--ink); font: 700 15px/1 var(--font-display); letter-spacing: -.01em;
  box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 16px 36px -14px rgba(13,23,29,.35);
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}
.alta-fab .icon { width: 22px; height: 22px; color: var(--orange); }
.alta-fab:hover { transform: translateY(-2px); box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 20px 40px -14px rgba(13,23,29,.4); }
.alta-on .alta-fab { opacity: 0; pointer-events: none; transform: scale(.9); }
@media (prefers-reduced-motion: reduce) { .alta-fab, .alta-fab:hover, .alta-on .alta-fab { transform: none; } }

/* --- componente --- */
html.alta-lock { overflow: hidden; }
.alta-scrim {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(13,23,29,.32); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.alta-scrim[hidden] { display: none; }
.alta-ui {

}
.alta-ui[hidden] { display: none; }

/* spotlight: campo em cima, sugestões embaixo, sem cabeçalho nem histórico */
.alta-ui.is-spot {
  top: 14vh; left: max(16px, calc(50% - 320px)); width: min(640px, calc(100vw - 32px)); max-height: 72vh;
}
.alta-ui.is-spot .alta-ui__head, .alta-ui.is-spot .alta-ui__log { display: none; }

/* painel: flutua à direita e deixa a página livre; no celular ocupa a tela */

@media (max-width: 767px) {
  .alta-ui.is-spot { top: 12px; }
