}

.alta-ui__head { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 10px 14px 18px; border-bottom: 1px solid var(--line-soft); }
.alta-ui__mark { flex: none; width: 26px; height: 26px; color: var(--orange); }
.alta-ui__mark svg { width: 100%; height: 100%; }
.alta-ui__title { flex: 1 1 auto; min-width: 0; }
.alta-ui__title h2 { font: 700 17px/22px var(--font-display); letter-spacing: -.02em; }
.alta-ui__title p { font: 400 12px/16px var(--font-body); color: var(--ink-65); }
.alta-ui__icon { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-65); transition: background .15s ease, color .15s ease; }
.alta-ui__icon:hover { background: var(--surface); color: var(--ink); }
.alta-ui__icon svg { width: 19px; height: 19px; }

.alta-ui__log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 22px; padding: 20px 20px 12px; }
.alta-msg--user { align-self: flex-end; max-width: 85%; }
.alta-msg--user .alta-msg__body { padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: var(--surface); font: 400 15px/22px var(--font-body); white-space: pre-wrap; }
.alta-msg--alta { max-width: 100%; }
.alta-msg--alta .alta-msg__body { font: 400 15px/24px var(--font-body); color: var(--ink); }
.alta-msg__body p + p, .alta-msg__body p + ul, .alta-msg__body ul + p { margin-top: 10px; }
.alta-msg__body ul { list-style: disc; padding-left: 20px; }
.alta-msg__body li + li { margin-top: 4px; }
.alta-msg__body strong { font-weight: 600; }
.alta-msg.is-error .alta-msg__body { color: var(--ink-65); }
.alta-msg.is-typing .alta-msg__body::before {
  content: ""; display: block; width: 36px; height: 10px;
  background: radial-gradient(circle, var(--ink-50) 3px, transparent 3.5px) 0 50% / 12px 10px repeat-x;
  animation: alta-dots 1s ease-in-out infinite;
}
@keyframes alta-dots { 50% { opacity: .35; } }
.alta-msg__action { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 14px; }
.alta-msg__cta {
  display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 20px;
  background: var(--orange); color: var(--white); font: 600 14px/1 var(--font-body); transition: filter .15s ease;
}
.alta-msg__cta:hover { filter: brightness(1.06); }
.alta-msg__wa { font: 500 13px/18px var(--font-body); color: var(--ink-65); text-decoration: underline; text-underline-offset: 2px; }
.alta-msg__wa:hover { color: var(--ink); }

.alta-ui__ask { flex: none; display: flex; align-items: flex-end; gap: 10px; margin: 8px 12px 0; padding: 8px 8px 8px 16px; border-radius: 22px; background: var(--surface); }
.alta-ui__mark--ask { width: 22px; height: 22px; margin-bottom: 9px; }
.alta-ui.is-panel .alta-ui__mark--ask { display: none; }
.alta-ui__input {
  flex: 1 1 auto; min-width: 0; resize: none; border: 0; background: transparent; padding: 8px 0;
  font: 400 15px/22px var(--font-body); color: var(--ink); max-height: 160px;
}
.alta-ui__input:focus { outline: none; }
.alta-ui__input::placeholder { color: var(--ink-50); }
.alta-ui.is-spot .alta-ui__ask { margin: 0; border-radius: 0; background: transparent; }
.alta-ui__ask.is-busy .alta-ui__send { opacity: .45; pointer-events: none; }

.alta-ui__suggest { flex: none; padding: 10px 8px 6px; overflow-y: auto; }
.alta-ui__suggest[hidden] { display: none; }
.alta-ui__suggest-title { padding: 6px 14px 8px; font: 600 11px/16px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-65); }
.alta-ui__suggest button {
  display: block; width: 100%; padding: 10px 14px; border-radius: 12px; text-align: left;
  font: 400 15px/21px var(--font-body); color: var(--ink); transition: background .12s ease;
}
.alta-ui__suggest button:hover, .alta-ui__suggest button:focus-visible { background: var(--surface); outline: none; }

.alta-ui__note { flex: none; padding: 10px 20px 14px; text-align: center; font: 400 11px/16px var(--font-body); color: var(--ink-65); }
.alta-ui.is-spot .alta-ui__note { border-top: 1px solid var(--line-soft); margin-top: 6px; }

@media (prefers-reduced-motion: reduce) { .alta-msg.is-typing .alta-msg__body::before { animation: none; } }

/* ==========================================================================
   PRODUTO EMPRESA (.px--emp): mesma estrutura editorial, registro mais sóbrio.
   Topo escuro, peso tipográfico mais leve, rótulos em caixa alta espaçada,
   etapas da consultoria e cotação sobre fundo escuro.
   ========================================================================== */
.lnav--emp { background: rgba(13,23,29,.88); border-bottom-color: rgba(255,255,255,.08); }
.lnav--emp .lnav__title { color: var(--white); font-weight: 500; }
.lnav--emp .lnav__links a { color: var(--white-70); }
.lnav--emp .lnav__links a:hover { color: var(--white); }

.px--emp .crumbs { background: var(--deep); }
.px--emp .crumbs li, .px--emp .crumbs li + li::before { color: var(--white-60); }
.px--emp .crumbs a { color: var(--white-70); }
.px--emp .crumbs a:hover { color: var(--white); }

.px--emp .px-hero { background: var(--deep); color: var(--white); padding-bottom: 96px; }
.px--emp .px-hero__h1 { color: var(--white); font-weight: 600; letter-spacing: -.045em; }
.px--emp .px-hero__h1 .accent { color: var(--orange-light); }
.px--emp .px-hero__lead { color: var(--white-70); font-weight: 400; }
.px--emp .px-hero__note { color: var(--white-60); }
.px--emp .px-link { color: var(--white); }
.px--emp .px-link .icon { color: var(--orange-light); }
.px--emp .px-hero__media { box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 80px -40px rgba(0,0,0,.6); }
.px-creds {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 0; margin-top: 28px;
  font: 600 11px/16px var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--white-60);
}
.px-creds li + li::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: 0 16px 2px; border-radius: 50%; background: var(--orange-light); vertical-align: middle; }

.px--emp .px-label { font: 600 12px/16px var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-65); }
.px--emp .px-label--white { color: var(--orange-light); }
.px--emp .px-h2 { font-weight: 600; letter-spacing: -.04em; }
.px--emp .stat__num { font-weight: 500; letter-spacing: -.04em; }
.px--emp .hl__text strong { font-weight: 600; }
.px--emp .px-sec--soft .hl__card { box-shadow: 0 2px 4px rgba(0,0,0,.03), 0 24px 48px -32px rgba(13,23,29,.3); }

/* etapas da consultoria */
.etapas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; list-style: none; counter-reset: none; }
.etapa { padding-top: 24px; border-top: 1px solid var(--line); }
.etapa__n { display: block; font: 500 44px/1 var(--font-display); letter-spacing: -.04em; color: var(--orange); }
.etapa h3 { margin-top: 20px; font: 600 19px/25px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.etapa p { margin-top: 8px; font: 400 15px/24px var(--font-body); color: var(--ink-65); }

/* cotação e fechamento sobre fundo escuro */
.px-sec--deep .px-marks li { color: var(--white-80); }
.px-sec--deep .px-marks .icon { color: var(--orange-light); }
.px--emp .px-end { background: radial-gradient(120% 90% at 50% 0%, #1C3240 0%, var(--deep) 60%); }

@media (max-width: 1023px) { .etapas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 767px) {
  .etapas { grid-template-columns: 1fr; gap: 28px; }
  .px--emp .px-hero { padding-bottom: 64px; }
  .px-creds li + li::before { margin: 0 10px 2px; }
}

/* =====================================================================
   PÁGINAS-HUB (Para você, Empresas): catálogo por grupo, cards do megamenu.
   ===================================================================== */
.hub { margin-top: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; list-style: none; }
.hub__card {
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  border-radius: 20px; background: var(--surface-2); color: inherit; text-decoration: none;
  transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s, background-color .3s;
}
.hub__card:hover { transform: translateY(-4px); background: var(--white); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 24px 48px -28px rgba(0,0,0,.28); }
.hub__card:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
.hub__media { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: var(--surface); }
.hub__media .media, .hub__media .ph { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
.hub__media .ph-label { font-size: 12px; }
.hub__body { display: flex; flex-direction: column; flex: 1; padding: 24px 24px 26px; }
.hub__icon { width: 24px; height: 24px; color: var(--orange); }
.hub__body strong { margin-top: 16px; font: 600 20px/26px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.hub__txt { margin-top: 8px; font: 400 15px/23px var(--font-body); color: var(--ink-65); }
.hub__more { margin-top: auto; padding-top: 20px; display: inline-flex; align-items: center; gap: 6px; font: 500 15px/20px var(--font-body); color: var(--orange); }
.hub__more .icon { width: 16px; height: 16px; transition: transform .3s; }
.hub__card:hover .hub__more .icon { transform: translateX(3px); }
.px-sec--soft .hub__card { background: var(--white); }
.px-sec--soft .hub__card:hover { box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 24px 48px -28px rgba(13,23,29,.32); }
.px--emp .hub__body strong { font-weight: 600; }
.px--emp .hub__more { color: var(--ink); }
.px--emp .hub__more .icon { color: var(--orange); }

/* índice de grupos logo abaixo do topo */
.hub-index { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 32px; margin-top: 40px; list-style: none; }
.hub-page .px-hero { padding-bottom: 72px; }
.hub-index a { font: 500 15px/22px var(--font-body); color: var(--ink-65); text-decoration: none; }
.hub-index a:hover { color: var(--ink); }
.px--emp .hub-index a { color: var(--white-70); }
.px--emp .hub-index a:hover { color: var(--white); }

.hub--n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hub--n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hub--n2 .hub__media { aspect-ratio: 16 / 8; }
@media (max-width: 1023px) { .hub, .hub--n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 639px) { .hub, .hub--n4, .hub--n2 { grid-template-columns: 1fr; } }

/* ==========================================================================
   SOBRE: página-história (/sobre/)
   Tudo que se move depende de html.st-motion (posto por um script no topo da página só
   quando o visitante não pediu movimento reduzido). Sem essa classe a página é estática e
   inteiramente legível: capítulos empilhados, palavras acesas, imagens visíveis.
   O progresso de cada cena vem em --p (0 a 1), calculado no scroll por setupStory (app.js).
   ========================================================================== */
.story { background: var(--deep); color: var(--white); }
.st-ch__list, .st-ch__rail, .st-vals__list, .st-num__grid, .st-reel__row { margin: 0; padding: 0; list-style: none; }
.st-wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.st-label { font: 600 13px/18px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--orange-light); }
.st-label--ink { color: var(--orange); }
.st-h2 { margin-top: 16px; font: 700 clamp(36px, 5.4vw, 76px)/1 var(--font-display); letter-spacing: -.045em; text-wrap: balance; }
.st-h2 .accent { color: var(--orange-light); }
.st-h2--ink { color: var(--ink); }
.st-h2--ink .accent { color: var(--orange); }
.st-lead { margin-top: 24px; max-width: 52ch; font: 400 clamp(17px, 1.5vw, 20px)/1.6 var(--font-body); color: var(--white-70); }
.st-lead--ink { color: var(--ink-65); }
.st-head { text-align: center; }
.st-head .st-lead { margin-inline: auto; }

/* --- 1. abertura: o recorte da foto cresce até a tela cheia ------------------ */
.st-open { position: relative; }
.st-open__stick {
  position: relative; display: flex; flex-direction: column; align-items: center;
  padding: 112px var(--gutter) 72px; text-align: center; overflow: hidden;
}
.st-open__top { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.st-open__h1 { font: 700 clamp(48px, 9vw, 136px)/.9 var(--font-display); letter-spacing: -.055em; max-width: 11ch; text-wrap: balance; }
.st-open__h1 .accent { color: var(--orange-light); }
.st-open__media { position: relative; width: min(100%, 1040px); margin-top: 56px; aspect-ratio: 16 / 9; border-radius: 28px; overflow: hidden; background: var(--navy); }
.st-open__media .media { object-position: center 40%; }
.st-open__media::after { content: ""; position: absolute; inset: 0; background: rgba(13,23,29,.35); }
.st-open__after {
  position: relative; z-index: 2; margin-top: 40px; max-width: 18ch;
  font: 700 clamp(30px, 4.6vw, 64px)/1.02 var(--font-display); letter-spacing: -.04em; text-wrap: balance;
}
.st-open__cue { display: none; }

.st-motion .st-open { height: 280vh; }
.st-motion .st-open__stick { position: sticky; top: 0; height: 100vh; height: 100svh; padding: 0; justify-content: center; }
.st-motion .st-open__top {
  position: absolute; top: 15vh; left: 0; right: 0; padding-inline: var(--gutter);
  opacity: calc(1 - var(--p, 0) * 2.6);
  transform: translateY(calc(var(--p, 0) * -10vh)) scale(calc(1 - var(--p, 0) * .08));
}
.st-motion .st-open__media {
  --ix: 21%; --it: 47%;
  position: absolute; inset: 0; width: auto; margin: 0; aspect-ratio: auto; border-radius: 0;
  clip-path: inset(calc((1 - var(--p, 0)) * var(--it)) calc((1 - var(--p, 0)) * var(--ix)) calc((1 - var(--p, 0)) * 7%) round calc((1 - var(--p, 0)) * 28px));
}
/* o recorte fica na metade de baixo da tela: desce a foto junto para ele enquadrar as pessoas */
.st-motion .st-open__media .media, .st-motion .st-open__media .ph {
  transform: translateY(calc((1 - var(--p, 0)) * 26%)) scale(calc(1.18 - var(--p, 0) * .18));
}
.st-motion .st-open__media::after { background: rgba(13,23,29, calc(.1 + var(--p, 0) * .5)); }
.st-motion .st-open__after {
  position: absolute; left: 0; right: 0; bottom: 18vh; margin: 0 auto; padding-inline: var(--gutter);
  opacity: clamp(0, calc((var(--p, 0) - .62) * 3.4), 1);
  transform: translateY(calc((1 - var(--p, 0)) * 60px));
}
.st-motion .st-open__cue {
  position: absolute; bottom: 28px; left: 50%; z-index: 2; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font: 500 13px/18px var(--font-body); color: var(--white-70); opacity: calc(1 - var(--p, 0) * 5);
}
.st-open__cue .icon { width: 18px; height: 18px; transform: rotate(90deg); animation: st-bob 1.8s ease-in-out infinite; }
@keyframes st-bob { 50% { translate: 0 6px; } }

/* --- 2. manifesto: as palavras acendem conforme o scroll --------------------- */
.st-words { padding-block: 160px; }
.st-words__text {
  max-width: 1080px; margin: 28px auto 0; text-align: center;
  font: 600 clamp(30px, 4.3vw, 60px)/1.2 var(--font-display); letter-spacing: -.03em; text-wrap: balance;
}
.st-words__text em { font-style: normal; color: var(--orange-light); }
.st-words__src { margin-top: 40px; text-align: center; font: 500 14px/20px var(--font-body); color: var(--white-60); }
.st-motion .st-words { height: 240vh; padding: 0; }
.st-motion .st-words__stick { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; flex-direction: column; justify-content: center; }
.st-motion .st-words__text .w {
  opacity: clamp(.14, calc(var(--p, 0) * (var(--n) + 6) - var(--i)), 1);
  transition: opacity .15s linear;
}

/* --- 3. capítulos: cena fixa, foto e texto trocam a cada trecho de scroll ---- */
.st-ch { padding-block: 40px 140px; }
.st-ch__head { margin-bottom: 80px; }
.st-ch__list { list-style: none; display: grid; gap: 96px; }
.st-ch__item { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(32px, 6vw, 88px); align-items: center; }
.st-ch__media { position: relative; aspect-ratio: 4 / 5; max-height: 76vh; width: 100%; border-radius: 24px; overflow: hidden; background: var(--navy); }
.st-ch__n { font: 600 13px/18px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--orange-light); }
.st-ch__title { margin-top: 18px; font: 700 clamp(34px, 4.4vw, 64px)/1 var(--font-display); letter-spacing: -.045em; text-wrap: balance; }
.st-ch__txt { margin-top: 22px; max-width: 40ch; font: 400 clamp(17px, 1.4vw, 20px)/1.6 var(--font-body); color: var(--white-70); }
.st-ch__rail { display: none; }

.st-motion .st-ch { padding: 0; }
.st-motion .st-ch__head { padding-top: 140px; margin-bottom: 0; }
.st-motion .st-ch__scene { height: calc(var(--n) * 95vh); }
.st-motion .st-ch__stick { position: sticky; top: 0; height: 100vh; height: 100svh; }
.st-motion .st-ch__list { display: block; position: relative; height: 100%; }
.st-motion .st-ch__item {
  position: absolute; inset: 0; padding-top: 72px; padding-bottom: 96px;
  opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s;
}
.st-motion .st-ch__item.is-active { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; }
.st-motion .st-ch__media { height: 100%; max-height: none; aspect-ratio: auto; }
.st-motion .st-ch__media .media, .st-motion .st-ch__media .ph { transform: scale(1.1); transition: transform 1.6s cubic-bezier(.2,.7,.2,1); }
.st-motion .st-ch__item.is-active .st-ch__media .media, .st-motion .st-ch__item.is-active .st-ch__media .ph { transform: scale(1); }
.st-motion .st-ch__copy > * { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
.st-motion .st-ch__item.is-active .st-ch__copy > * { opacity: 1; transform: none; }
.st-motion .st-ch__item.is-active .st-ch__title { transition-delay: .08s; }
.st-motion .st-ch__item.is-active .st-ch__txt { transition-delay: .16s; }
.st-motion .st-ch__rail {
  position: absolute; left: var(--gutter); right: calc(var(--gutter) + 120px); bottom: 36px; z-index: 2;
  display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; list-style: none;
}
.st-ch__rail li { position: relative; padding-top: 14px; font: 500 13px/18px var(--font-body); color: var(--white-60); transition: color .3s ease; }
.st-ch__rail li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.16); }
.st-ch__rail li::after { content: ""; position: absolute; top: 0; left: 0; height: 2px; width: calc(var(--f, 0) * 100%); background: var(--orange-light); }
.st-ch__rail li.is-on { color: var(--white); }

/* --- 4. números -------------------------------------------------------------- */
.st-num { padding-block: 140px; border-top: 1px solid rgba(255,255,255,.08); }
/* números em linhas: o número ocupa a metade esquerda e a descrição a direita, separados por
   uma linha fina. Cada número tem sempre meia largura, então nunca encosta no vizinho. */
.st-num__grid { list-style: none; display: grid; max-width: 1080px; margin: 80px auto 0; border-bottom: 1px solid rgba(255,255,255,.14); }
.st-num__item {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 40px;
  padding-block: 40px; border-top: 1px solid rgba(255,255,255,.14);
}
.st-num__v { display: block; font: 700 clamp(60px, 8.6vw, 128px)/.9 var(--font-display); letter-spacing: -.055em; white-space: nowrap; }
.st-num__v .u { color: var(--orange-light); }
.st-num__v .u--sm { font-size: .36em; letter-spacing: -.02em; }
.st-num__l { display: block; max-width: 22ch; font: 500 clamp(18px, 1.7vw, 24px)/1.35 var(--font-display); letter-spacing: -.01em; color: var(--white-80); }

/* --- 5. faixas de fotos que correm em sentidos opostos ----------------------- */
.st-reel { padding-block: 140px 120px; background: var(--white); color: var(--ink); overflow: hidden; }
.st-reel__rows { margin-top: 72px; display: flex; flex-direction: column; gap: 20px; }
.st-reel__row { display: flex; gap: 20px; width: max-content; list-style: none; will-change: transform; }
.st-reel__row--a { transform: translateX(calc(var(--p, .5) * -32% + 4%)); }
.st-reel__row--b { transform: translateX(calc(-28% + var(--p, .5) * 32%)); }
.st-reel__tile { position: relative; flex: none; height: clamp(200px, 26vw, 360px); aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--surface-2); }
.st-reel__tile--wide { aspect-ratio: 3 / 2; }

/* --- 6. valores: linhas editoriais, a foto se abre ao entrar na tela --------- */
.st-vals { padding-block: 40px 160px; background: var(--white); color: var(--ink); }
.st-vals__list { list-style: none; margin-top: 96px; display: grid; gap: 128px; }
.st-val { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(32px, 6vw, 96px); align-items: center; }
.st-val:nth-child(even) .st-val__media { order: 2; }
.st-val__media { position: relative; aspect-ratio: 5 / 4; border-radius: 24px; overflow: hidden; background: var(--surface-2); }
.st-val__n { font: 600 13px/18px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--orange); }
.st-val__t { margin-top: 18px; font: 700 clamp(32px, 4vw, 56px)/1.02 var(--font-display); letter-spacing: -.045em; text-wrap: balance; }
.st-val__p { margin-top: 20px; max-width: 40ch; font: 400 clamp(17px, 1.4vw, 19px)/1.6 var(--font-body); color: var(--ink-65); }

.st-motion [data-reveal] { opacity: 0; transform: translateY(40px); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.7,.2,1); }
.st-motion [data-reveal].is-in { opacity: 1; transform: none; }
.st-motion [data-reveal="media"] { opacity: 1; transform: none; clip-path: inset(10% 10% 10% 10% round 24px); transition: clip-path 1.3s cubic-bezier(.2,.7,.2,1); }
.st-motion [data-reveal="media"] .media, .st-motion [data-reveal="media"] .ph { transform: scale(1.25); transition: transform 1.6s cubic-bezier(.2,.7,.2,1); }
.st-motion [data-reveal="media"].is-in { clip-path: inset(0 0 0 0 round 24px); }
.st-motion [data-reveal="media"].is-in .media, .st-motion [data-reveal="media"].is-in .ph { transform: none; }

/* --- 7. vídeos ------------------------------------------------------------- */
.st-films { padding-block: 140px; }
.st-films__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 72px; }
.st-films__grid .video { max-width: none; aspect-ratio: 16 / 10; }
.st-films__grid .video:first-child { grid-column: 1 / -1; aspect-ratio: 21 / 9; }

/* --- 8. citação sobre o laranja (texto branco, peso 600 ou mais) ------------- */
.st-quote { padding-block: 180px; text-align: center; color: var(--white); background: linear-gradient(182deg, var(--red) 0%, var(--orange) 78%); overflow: hidden; }
.st-quote__q { max-width: 15ch; margin-inline: auto; font: 700 clamp(44px, 7vw, 108px)/.95 var(--font-display); letter-spacing: -.05em; text-wrap: balance; }
.st-quote__m { margin-top: 36px; font: 600 15px/22px var(--font-body); color: var(--white); }
.st-motion .st-quote__q { transform: scale(calc(.9 + var(--p, .5) * .16)); }

/* --- 10. fechamento com foto de fundo -------------------------------------- */
.st-end { position: relative; isolation: isolate; overflow: hidden; min-height: 92vh; display: flex; align-items: flex-end; padding-block: 140px 112px; color: var(--white); }
.st-end__bg { position: absolute; inset: 0; z-index: -2; }
.st-end__bg .media { object-position: center 55%; }
.st-motion .st-end__bg .media, .st-motion .st-end__bg .ph { transform: scale(calc(1.18 - var(--p, 0) * .18)); }
.st-end::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgba(13,23,29,.92) 0%, rgba(13,23,29,.55) 45%, rgba(13,23,29,.2) 100%); }
.st-end__h2 { font: 700 clamp(46px, 7.4vw, 112px)/.93 var(--font-display); letter-spacing: -.055em; max-width: 12ch; text-wrap: balance; }
.st-end__h2 .accent { color: var(--orange-light); }
.st-end .st-lead { color: var(--white-80); }
.st-end .px-hero__ctas { justify-content: flex-start; }

.px-link--white { color: var(--white); }
.px-link--white .icon { color: var(--orange-light); }

@media (max-width: 1023px) {
  .st-motion .st-ch__rail li { font-size: 12px; }
}
@media (max-width: 767px) {
  .st-num__item { grid-template-columns: 1fr; gap: 12px; padding-block: 28px; }
  .st-open__stick { padding-top: 88px; }
  .st-motion .st-open__media { --ix: 6%; --it: 52%; }
  .st-ch__item, .st-val { grid-template-columns: 1fr; }
  .st-val:nth-child(even) .st-val__media { order: 0; }
  .st-motion .st-ch__item { grid-template-rows: minmax(0, 1fr) auto; gap: 24px; padding-top: 96px; padding-bottom: 88px; align-items: end; }
  .st-motion .st-ch__txt { font-size: 16px; }
  .st-motion .st-ch__rail { top: 76px; bottom: auto; right: var(--gutter); gap: 6px; }
  .st-motion .st-ch__rail li { font-size: 0; padding-top: 0; height: 2px; }
  .st-films__grid { grid-template-columns: 1fr; }
  .st-films__grid .video:first-child { aspect-ratio: 16 / 10; }
  .st-reel__tile { height: 220px; }
  .st-num, .st-films, .st-words { padding-block: 96px; }
  .st-quote { padding-block: 120px; }
  .st-vals__list { gap: 80px; margin-top: 64px; }
}
.st-light { background: var(--white); color: var(--ink); }

/* missão: a frase-mãe da marca, em destaque logo depois da abertura */
.st-mission { padding-block: 160px 120px; }
.st-mission__h { margin-top: 20px; font: 700 clamp(52px, 9vw, 140px)/.92 var(--font-display); letter-spacing: -.055em; text-wrap: balance; }
.st-mission__h .accent { color: var(--orange-light); }
.st-mission__p { font-size: clamp(19px, 1.9vw, 26px); color: var(--white-80); max-width: 34ch; }

/* fechamento: frase do documentário acima do título */
.st-end__q { max-width: 44ch; margin-bottom: 32px; }
.st-end__q p { font: 600 clamp(19px, 1.7vw, 24px)/1.3 var(--font-display); letter-spacing: -.02em; color: var(--white-90, #fff); }
.st-end__q footer { margin-top: 12px; font: 500 14px/20px var(--font-body); color: var(--white-70); }
.st-end:has(.st-end__q) { padding-top: 112px; }

@media (max-width: 899px) {
  .st-mission { padding-block: 112px 88px; }
}

/* ==========================================================================
   HOME: INTERAÇÕES DE SCROLL
   Restrito a <main data-motion> com html.st-motion (sem "reduzir movimento").
   O motor é o mesmo da Sobre (setupStory, app.js): data-scrub, data-reveal,
   data-words, data-count e data-chat-play.
   ========================================================================== */
/* hero: entra em cascata ao carregar e recua ao sair da tela */
.st-motion [data-motion] .hl-hero .hero__top > *,
.st-motion [data-motion] .hl-hero .quote { animation: hl-in 1s cubic-bezier(.2,.7,.2,1) both; }
.st-motion [data-motion] .hl-hero .hero__tagline { animation-delay: .12s; }
.st-motion [data-motion] .hl-hero .steps { animation-delay: .24s; }
.st-motion [data-motion] .hl-hero .quote { animation-delay: .38s; animation-duration: 1.2s; }
@keyframes hl-in { from { opacity: 0; transform: translateY(36px); } }
.st-motion [data-motion] .hl-hero .hero__inner {
  /* só recua depois que o formulário inteiro já passou pela tela */
  --k: clamp(0, calc((var(--p, 0) - .42) * 1.9), 1);
  opacity: calc(1 - var(--k));
  transform: translateY(calc(var(--k) * -6vh)) scale(calc(1 - var(--k) * .06));
  transform-origin: 50% 0;
}

/* entradas em cascata: --d é a posição do item na sequência. O atraso vale só na entrada;
   na saída (subindo) tudo sai junto. */
.st-motion [data-motion] [data-reveal].is-in { transition-delay: calc(var(--d, 0) * 70ms); }
/* cards de produto: um de cada vez, subindo e crescendo. A entrada usa translate/scale,
   que são independentes do transform: o hover (translateY -2px) continua instantâneo. */
.st-motion [data-motion] :is(.pv-hero, .pv-card, .emp-card)[data-reveal] {
  transform: none; translate: 0 56px; scale: .94;
  transition: opacity .7s ease, translate 1s cubic-bezier(.2,.7,.2,1), scale 1s cubic-bezier(.2,.7,.2,1),
              transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
.st-motion [data-motion] :is(.pv-hero, .pv-card, .emp-card)[data-reveal].is-in {
  translate: none; scale: none;
  transition-delay: var(--dl), var(--dl), var(--dl), 0s, 0s, 0s, 0s;
  --dl: calc(var(--d, 0) * 160ms);
}
.st-motion [data-motion] .pv-card[data-reveal].is-in:hover,
.st-motion [data-motion] .emp-card[data-reveal].is-in:hover { transform: translateY(-2px); }
.st-motion [data-motion] .emp-card:nth-child(2) { --d: 1; }
.st-motion [data-motion] .emp-card:nth-child(3) { --d: 2; }
.st-motion [data-motion] .emp-card:nth-child(4) { --d: 3; }
.st-motion [data-motion] .emp-card:nth-child(5) { --d: 4; }
.st-motion [data-motion] .emp-card:nth-child(6) { --d: 5; }
.st-motion [data-motion] .emp__photo[data-reveal="media"] { clip-path: inset(8% 8% 8% 8% round var(--r-lg)); }
.st-motion [data-motion] .emp__photo[data-reveal="media"].is-in { clip-path: inset(0 0 0 0 round var(--r-lg)); }

/* título do Para você: cada palavra sobe e acende conforme o scroll */
.st-motion [data-motion] .hl-words .w {
  display: inline-block;
  --k: clamp(0, calc((var(--p, 0) - .1) * (var(--n) + 1) * 2.2 - var(--i)), 1);
  opacity: calc(.12 + var(--k) * .88);
  transform: translateY(calc((1 - var(--k)) * .35em));
}
.st-motion [data-motion] .hl-words em.w { font-style: normal; color: var(--orange); }

/* título da Empresa: as duas linhas chegam de lados opostos (a seção corta o que vem de fora) */
.st-motion [data-motion] .emp { overflow-x: clip; }
.st-motion [data-motion] .hl-split[data-reveal] { opacity: 1; transform: none; }
.st-motion [data-motion] .hl-split span { transition: transform 1.1s cubic-bezier(.2,.7,.2,1), opacity .9s ease; opacity: 0; }
.st-motion [data-motion] .hl-split span:first-child { transform: translateX(-12%); }
.st-motion [data-motion] .hl-split span:last-child { transform: translateX(12%); transition-delay: .1s; }
.st-motion [data-motion] .hl-split.is-in span { opacity: 1; transform: none; }

/* nossa história: cena fixa. O texto sai e o vídeo cresce até ocupar a tela */
.st-motion [data-motion] .hl-hist { height: 260vh; padding: 0; }
.st-motion [data-motion] .hl-hist__stick {
  position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.hl-hist__head { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.st-motion [data-motion] .hl-hist__head {
  position: absolute; top: 13vh; left: 0; right: 0; z-index: 2;
  opacity: clamp(0, calc(1 - var(--p, 0) * 2.8), 1);
  transform: translateY(calc(var(--p, 0) * -14vh));
}
.hl-hist__media { width: 100%; display: flex; justify-content: center; padding-inline: var(--gutter); margin-top: 56px; }
.st-motion [data-motion] .hl-hist__media {
  --k: clamp(0, calc((var(--p, 0) - .12) * 1.6), 1);
  position: absolute; inset: 0; margin: 0; padding: 0;
  clip-path: inset(calc((1 - var(--k)) * 64%) calc((1 - var(--k)) * 18%) calc((1 - var(--k)) * 5%) round calc((1 - var(--k)) * 24px));
}
.st-motion [data-motion] .hl-hist__media .video { max-width: none; height: 100%; aspect-ratio: auto; border-radius: 0; }
.st-motion [data-motion] .hl-hist__media .video .media,
.st-motion [data-motion] .hl-hist__media .video .ph { transform: scale(calc(1.15 - var(--k) * .15)); }
.st-motion [data-motion] .hl-hist__media .video__play { opacity: clamp(0, calc((var(--k) - .55) * 3), 1); }
.st-motion [data-motion] .hl-hist__media .video__caption { opacity: clamp(0, calc((var(--k) - .7) * 4), 1); }

/* Alta: a conversa de exemplo acontece quando o chat entra na tela */
.hl-typing { display: none; }
.st-motion [data-motion] .hl-chat > * {
  opacity: 0; transform: translateY(16px);
  transition: opacity .35s ease, transform .35s ease;            /* saída: tudo junto e rápido */
}
.st-motion [data-motion] .hl-chat.is-playing > * {
  opacity: 1; transform: none;
  transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1);
}
.st-motion [data-motion] .hl-chat.is-playing .chat__user { transition-delay: .1s; }
.st-motion [data-motion] .hl-chat.is-playing .chat__alta { transition-delay: 2.3s; }
.st-motion [data-motion] .hl-chat.is-playing .chat__quick { transition-delay: 2.9s; }
.st-motion [data-motion] .hl-chat .hl-typing {
  display: inline-flex; gap: 5px; align-self: flex-start; padding: 14px 16px; border-radius: 18px;
  background: var(--surface-2); height: 0; padding-block: 0; overflow: hidden;
}
.st-motion [data-motion] .hl-chat.is-playing .hl-typing { opacity: 0; animation: hl-typing 1.5s ease .8s both; }
.hl-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-40, #9aa0a4); animation: hl-dot 1s ease-in-out infinite; }
.hl-typing span:nth-child(2) { animation-delay: .15s; }
.hl-typing span:nth-child(3) { animation-delay: .3s; }
@keyframes hl-typing {
  0% { opacity: 0; height: 0; padding-block: 0; transform: translateY(8px); }
  12%, 85% { opacity: 1; height: 35px; padding-block: 14px; transform: none; }
  100% { opacity: 0; height: 0; padding-block: 0; margin-top: -16px; }
}
@keyframes hl-dot { 50% { transform: translateY(-4px); opacity: .5; } }

/* CTA final: os colchetes surgem juntos, "Com você." abre entre eles e depois chega "Sempre." */
.st-motion [data-motion] .hl-sempre[data-reveal] { opacity: 1; transform: none; }
.st-motion [data-motion] .hl-sempre .bracket { opacity: 0; transition: opacity .5s ease; }
.st-motion [data-motion] .hl-sempre .accent,
.st-motion [data-motion] .hl-sempre .plain {
  display: inline-block; vertical-align: bottom; white-space: pre; overflow: hidden;
  max-width: 0; opacity: 0; transform: translateY(.4em);
  transition: max-width 1s cubic-bezier(.6,0,.2,1), opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1);
}
.st-motion [data-motion] .hl-sempre.is-in .bracket { opacity: 1; }
.st-motion [data-motion] .hl-sempre.is-in .accent { max-width: 12em; opacity: 1; transform: none; transition-delay: .35s, .55s, .55s; }
.st-motion [data-motion] .hl-sempre.is-in .plain { max-width: 12em; opacity: 1; transform: none; transition-delay: 1.5s, 1.7s, 1.7s; }

@media (max-width: 767px) {
  /* no celular o formulário é longo e é preenchido rolando: o hero não recua */
  .st-motion [data-motion] .hl-hero .hero__inner { opacity: 1; transform: none; }
  .st-motion [data-motion] .hl-hist { height: 220vh; }
  .st-motion [data-motion] .hl-hist__media { clip-path: inset(calc((1 - var(--k)) * 58%) calc((1 - var(--k)) * 5%) calc((1 - var(--k)) * 8%) round calc((1 - var(--k)) * 20px)); }
}

/* ==========================================================================
   PRODUTOS E HUBS: INTERAÇÕES DE SCROLL
   Mesmo motor da home e da Sobre (setupStory, app.js), aplicado pela estrutura
   comum do padrão .px: nenhum template precisa de marcação. Produto novo já nasce
   com elas. Sem html.st-motion (pedido de "reduzir movimento") tudo fica estático.
   ========================================================================== */
/* topo: entra em cascata ao carregar; a foto se abre e, ao rolar, desliza dentro da moldura */
.st-motion main.px .px-hero .container > * { animation: hl-in 1s cubic-bezier(.2,.7,.2,1) both; }
.st-motion main.px .px-hero .container > :nth-child(2) { animation-delay: .1s; }
.st-motion main.px .px-hero .container > :nth-child(3) { animation-delay: .2s; }
.st-motion main.px .px-hero .container > :nth-child(4) { animation-delay: .3s; }
.st-motion main.px .px-hero .container > :nth-child(5) { animation-delay: .36s; }
.st-motion main.px .px-hero .container > :nth-child(n+6) { animation-delay: .42s; }
.st-motion main.px .px-hero .px-hero__media { animation: px-open 1.4s cubic-bezier(.2,.7,.2,1) .35s both; }
@keyframes px-open { from { clip-path: inset(8% 8% 8% 8% round 28px); opacity: 0; } to { clip-path: inset(0 0 0 0 round 28px); opacity: 1; } }
.st-motion main.px .px-hero__media .media,
.st-motion main.px .px-hero__media .ph { transform: translateY(calc(var(--p, 0) * 7%)) scale(1.14); }   /* 7% de deslocamento cabe nos 7% de sobra de cada lado */

/* blocos que entram ao descer e saem ao subir. --d (app.js) é a posição entre os irmãos */
.st-motion main.px :is(.px-head > *, .px-sec > .container > .px-h2, .prod-split > div:first-child > *,
  .px-quote__copy > *, .px-end .container > *, .hub-index) {
  opacity: 0; translate: 0 32px;
  transition: opacity .8s ease, translate 1s cubic-bezier(.2,.7,.2,1);
}
.st-motion main.px :is(.hl__card, .stat, .cov__item, .exc > li, .plan, .etapa, .faq__item, .rel__item,
  .why__item, .price__col, .hub > li, .px-quote__form) {
  opacity: 0; translate: 0 48px; scale: .96;
  transition: opacity .7s ease, translate 1s cubic-bezier(.2,.7,.2,1), scale 1s cubic-bezier(.2,.7,.2,1),
              transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.st-motion main.px .is-in:is(.px-head > *, .px-sec > .container > .px-h2, .prod-split > div:first-child > *,
  .px-quote__copy > *, .px-end .container > *, .hub-index) {
  opacity: 1; translate: none; transition-delay: calc(var(--d, 0) * 90ms);
}
.st-motion main.px .is-in:is(.hl__card, .stat, .cov__item, .exc > li, .plan, .etapa, .faq__item, .rel__item,
  .why__item, .price__col, .hub > li, .px-quote__form) {
  opacity: 1; translate: none; scale: none;
  transition-delay: var(--dl), var(--dl), var(--dl), 0s, 0s, 0s, 0s;
  --dl: calc(var(--d, 0) * 110ms);
}
/* o número das etapas da consultoria desenha um traço laranja quando a etapa entra */
.st-motion main.px .etapa .etapa__n { background-image: linear-gradient(var(--orange-light), var(--orange-light));
  background-repeat: no-repeat; background-position: 0 100%; background-size: 0 2px; padding-bottom: 6px;
  transition: background-size .9s cubic-bezier(.2,.7,.2,1); }
.st-motion main.px .etapa.is-in .etapa__n { background-size: 100% 2px; transition-delay: calc(var(--d, 0) * 110ms + .3s); }

/* abas de conteúdo: o painel novo entra em cascata a cada troca */
.st-motion main.px .dtab:not([hidden]) > * { animation: hl-in .6s cubic-bezier(.2,.7,.2,1) both; }
.st-motion main.px .dtab:not([hidden]) > :nth-child(2) { animation-delay: .08s; }
.st-motion main.px .dtab:not([hidden]) .dtab__check li { animation: hl-in .5s cubic-bezier(.2,.7,.2,1) both; }
.st-motion main.px .dtab:not([hidden]) .dtab__check li:nth-child(2) { animation-delay: .18s; }
.st-motion main.px .dtab:not([hidden]) .dtab__check li:nth-child(3) { animation-delay: .26s; }
.st-motion main.px .dtab:not([hidden]) .dtab__check li:nth-child(n+4) { animation-delay: .34s; }

/* celulares baixos (ou Safari com a barra de endereço à vista): o texto do capítulo compacta
   para a foto não sumir */
@media (max-width: 767px) and (max-height: 700px) {
  .st-motion .st-ch__item { gap: 16px; padding-top: 92px; padding-bottom: 76px; }
  .st-motion .st-ch__rail { top: 72px; }
  .st-motion .st-ch__title { margin-top: 10px; font-size: 28px; }
  .st-motion .st-ch__txt { margin-top: 12px; font-size: 15px; line-height: 1.5; }
}

/* ==========================================================================
   TESTE: ANIMAÇÃO DA MARCA (/lab/logo/)
   Triângulo em duas partes que viram os colchetes; depois "Seguro" e "é Seguralta".
   A troca de forma é feita em JS (src/lab-logo.html); aqui ficam só as entradas.
   ========================================================================== */
.lg-stage {
  min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 56px; padding: 40px var(--gutter); background: #F5F5F5; color: var(--ink);
}
.lg { width: min(720px, 88vw); height: auto; overflow: visible; }
/* traços: triângulo, quadrado e colchetes no laranja da marca. A janela visível (cauda até a
   ponta) é controlada no JS */
.lg-line { fill: none; stroke: #FF6400; stroke-linejoin: miter; stroke-miterlimit: 10; stroke-linecap: butt; }
/* palavras. "Seguro" e o É só aparecem, letra a letra, com um pequeno quique (o acento cai por cima).
   SEGURALTA é escrita à mão: o contorno de cada letra é traçado e depois ela se preenche, da
   esquerda para a direita. No grupo de "é Seguralta": 1º o É, 2º o acento, 3º em diante as letras
   (separadas no JS). --i vem do JS, pela posição de cada forma */
.lg-word path { transform-box: fill-box; stroke: none; }
.lg-word--seguro path, .lg-word--seguralta path:nth-child(-n+2) { opacity: 0; transform: translateY(40%) scale(.92); }
.lg-word--seguralta path:nth-child(2) { transform: translateY(-160%); }
.lg.is-seguro .lg-word--seguro path,
.lg.is-seguralta .lg-word--seguralta path:nth-child(-n+2) {
  opacity: 1; transform: none;
  transition: opacity .35s ease, transform .6s cubic-bezier(.34,1.56,.64,1);
}
.lg.is-seguro .lg-word--seguro path { transition-delay: calc(var(--i) * 55ms); }
.lg.is-seguralta .lg-word--seguralta path:nth-child(2) { transition-delay: .12s; }

.lg-word--seguralta path:nth-child(n+3) {
  stroke: #FF6400; stroke-width: .9; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; fill-opacity: 0;
}
.lg.is-seguralta .lg-word--seguralta path:nth-child(n+3) {
  stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0;
  --d: calc((var(--i) - 2) * 120ms + .25s);                   /* começa logo depois do É */
  transition: stroke-dashoffset .7s cubic-bezier(.55,0,.35,1) var(--d),
              fill-opacity .45s ease calc(var(--d) + .5s),
              stroke-opacity .3s ease calc(var(--d) + .85s);
}
/* volta do loop: depois da borracha (máscara no SVG), as palavras ficam escondidas de uma vez,
   sem transição, para a máscara poder voltar limpa */
.lg.is-sai .lg-word path:nth-child(n) { opacity: 0; transition: none; }   /* :nth-child(n) iguala a força das regras do É */
.lg-replay { font: 600 14px/20px var(--font-body); color: var(--ink-65); padding: 10px 4px; border-bottom: 1px solid rgba(0,0,0,.18); }
.lg-replay:hover { color: var(--ink); border-color: var(--orange); }

</style>

<script>
(function () {
  /* Espaço do logo (559 x 121), pela linha do meio do traço (espessura W, a do colchete).
     O quadrado tem a altura da logo (121) e fica no centro; o triângulo usa a base do quadrado,
     com a inclinação do triângulo da marca. */
  var CXa = 279.5, k = 1.0455, W = 9.13;
  var Y0 = W / 2, Y1 = 121 - W / 2, HQ = 60.5 - W / 2, BAR = 38.94 - 4.6;
  var xL = CXa - HQ, xR = CXa + HQ;
  var WF = 3.6, R0 = 7;                                       /* fase fina: espessura e raio dos cantos */
  /* triângulo: proporção do triângulo laranja da logo antiga, sobre a base do quadrado */
  var HB = HQ - R0, triTop = Y1 - HB * 352 / 488;
  var ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var dist = function (a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); };
  var pt = function (p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); };
  var len = function (pts) { var s = 0; for (var i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]); return s; };
  /* uma linha só: sobe do canto esquerdo ao topo, desce ao canto direito e volta pela base;
     a última perna passa meio traço do canto para o encontro com o quadrado não ficar vazado */
  /* sobe pela esquerda, contorna o topo e o canto de baixo à direita em curva e termina já na base,
     exatamente onde o quadrado começa (canto de baixo à direita, antes da curva dele) */
  var RT = 7, RC = 7;                                         /* curvas do topo e do canto do triângulo */
  function triD() {
    var start = [xR - R0, Y1], corner = [start[0] + RC, Y1], apex = [CXa, triTop], bl = [xL + R0, Y1];   /* começa onde a curva do quadrado começa */
    var toward = function (a, b, d) { var l = dist(a, b); return [a[0] + (b[0] - a[0]) * d / l, a[1] + (b[1] - a[1]) * d / l]; };
    return 'M' + pt(bl) + ' L' + pt(toward(apex, bl, RT)) + ' Q' + pt(apex) + ' ' + pt(toward(apex, corner, RT)) +
      ' L' + pt(toward(corner, apex, RC)) + ' Q' + pt(corner) + ' ' + pt(start);
  }
  var LT, LQ, S1;                                             /* medidos em play() */  /* S1: quanto a ponta anda antes da cauda sair */
  var GOAL = {
    fora:   [[38.94, 4.54], [4.6, 4.54], [4.6, 116.46], [38.94, 116.46]],
    dentro: [[519.46, 4.54], [553.8, 4.54], [553.8, 116.46], [519.46, 116.46]]
  };
  var svg = document.querySelector('[data-logo]');
  var tri = svg.querySelector('[data-tri]'), quad = svg.querySelector('[data-quad]');
  var ponto = svg.querySelector('[data-ponto]'), START = [xL + R0, Y1];   /* onde o triângulo nasce */
  ponto.setAttribute('cx', START[0]); ponto.setAttribute('cy', START[1]); ponto.setAttribute('r', 0);
  var RP = 6;                                                  /* o ponto em repouso: bem visível, depois encolhe até a ponta da linha */
  function raio(from, to, dur, curve) { tween(dur, function (e) { ponto.setAttribute('r', Math.max(0, from + (to - from) * e).toFixed(2)); }, 'ponto', curve); }
  var el = { fora: svg.querySelector('[data-chev="cima"]'), dentro: svg.querySelector('[data-chev="baixo"]') };
  var seg = function () { return svg.querySelector('[data-pos="seguro"]'); };
  var shift = function (pts, dx) { return pts.map(function (p) { return [p[0] + dx, p[1]]; }); };
  /* quadrado pela linha do meio, com escala s em torno do centro e cantos de raio r. Começa no
     canto de baixo à esquerda e sobe, como a linha chega do triângulo */
  function quadD(s, r) {
    var cy = 60.5, hx = HQ * s, hy = (Y1 - Y0) / 2 * s, l = CXa - hx, rt = CXa + hx, t = cy - hy, b = cy + hy;
    r = Math.min(r, hx, hy);
    var A = function (x, y) { return ' A' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 0 1 ' + x.toFixed(2) + ' ' + y.toFixed(2); };
    if (r < .01) return 'M' + pt([rt, b]) + ' L' + pt([l, b]) + ' L' + pt([l, t]) + ' L' + pt([rt, t]) + ' Z';
    return 'M' + pt([rt - r, b]) + ' L' + pt([l + r, b]) + A(l, b - r) + ' L' + pt([l, t + r]) + A(l + r, t) +
      ' L' + pt([rt - r, t]) + A(rt, t + r) + ' L' + pt([rt, b - r]) + A(rt - r, b) + ' Z';
  }
  function poly(node, pts, close) { node.setAttribute('d', 'M' + pts.map(pt).join(' L') + (close ? ' Z' : '')); }
  function win(node, tail, head, L) {                          /* só o trecho da cauda à ponta aparece */
    node.style.opacity = head - tail > .05 ? '' : '0';        /* ponta redonda com comprimento zero viraria um ponto */
    node.style.strokeDasharray = Math.max(0, head - tail).toFixed(2) + ' ' + (L * 2).toFixed(2);
    node.style.strokeDashoffset = (-tail).toFixed(2);
  }
  var CX = 279.2, off, pos = {};
  function layout() {
    var bb = seg().getBBox(), pad = bb.x - 9.2, ds = CX - (bb.x + bb.width / 2);
    pos.perto = { fora: xL - 4.6, dentro: xR - 553.8, seguro: ds };   /* os lados do quadrado */
    pos.seguro = { fora: ds, dentro: (bb.x + bb.width + ds + pad) - 549.19, seguro: ds };
    pos.final = { fora: 0, dentro: 0, seguro: 0 };
  }
  var copy = function (o) { return { fora: o.fora, dentro: o.dentro, seguro: o.seguro }; };
  var timers = [], rafs = {};
  /* mola: passa um pouco do ponto e volta (s controla o quanto) */
  var spring = function (s) { return function (t) { var c = s + 1; return 1 + c * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); }; };
  function tween(dur, fn, key, curve) {
    cancelAnimationFrame(rafs[key]);
    var t0 = performance.now(), cv = curve || ease;
    (function tick(now) { var t = Math.min(1, (now - t0) / dur); fn(cv(t)); if (t < 1) rafs[key] = requestAnimationFrame(tick); })(t0);
  }
  /* 1 e 2. a ponta percorre triângulo e quadrado seguidos; a cauda sai depois de S1 e apaga o
     triângulo inteiro exatamente quando a ponta fecha o quadrado */
  var soft = function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; };   /* curva suave: o triângulo não passa correndo */
  function desenha(dur) {
    var t0 = performance.now();
    cancelAnimationFrame(rafs.linha);
    (function tick(now) {
      var t = Math.min(1, (now - t0) / dur), e = soft(t);
      var h = e * (LT + LQ), tail = Math.min(LT, h <= S1 ? 0 : (h - S1) / (LT + LQ - S1) * LT);   /* S1: só depois que a base fecha o triângulo */
      win(tri, tail, Math.min(h, LT), LT);
      win(quad, 0, Math.max(0, h - LT), LQ);
      if (t < 1) { rafs.linha = requestAnimationFrame(tick); return; }
      quad.style.strokeDasharray = 'none'; quad.style.strokeDashoffset = '0'; tri.style.visibility = 'hidden';
    })(t0);
  }
  /* recolhe (tomando impulso), expande passando do ponto enquanto engrossa e perde o arredondado,
     e assenta no tamanho certo */
  function assenta(dur) {
    var t0 = performance.now(), mix1 = function (a, b, t) { return a + (b - a) * t; };
    var S0 = .8, S1x = 1.15, WX = W * 1.35;                     /* recolhe até 80%, passa até 115%; a borda passa 35% */
    quad.setAttribute('stroke-linecap', 'butt');
    (function tick(now) {
      var t = Math.min(1, (now - t0) / dur), sc, g, w;
      if (t < .3) { var u = ease(t / .3); sc = mix1(1, S0, u); g = 0; w = WF; }                       /* recolhe */
      else if (t < .62) { var v = 1 - Math.pow(1 - (t - .3) / .32, 3); sc = mix1(S0, S1x, v); g = v; w = mix1(WF, WX, v); } /* expande e a borda engrossa além */
      else { var z = ease((t - .62) / .38); sc = mix1(S1x, 1, z); g = 1; w = mix1(WX, W, z); }        /* assenta: tamanho e borda voltam ao normal */
      quad.setAttribute('d', quadD(sc, R0 * (1 - g)));
      quad.setAttribute('stroke-width', w.toFixed(2));
      quad.setAttribute('stroke-linejoin', g > .98 ? 'miter' : 'round');
      if (t < 1) rafs.assenta = requestAnimationFrame(tick);
    })(t0);
  }
  /* 3. o quadrado se abre: vira duas metades e as barras recuam do centro até o tamanho do colchete */
  function abre(dur) {
    quad.style.visibility = tri.style.visibility = 'hidden';
    ['fora', 'dentro'].forEach(function (n) { el[n].style.visibility = ''; });
    tween(dur, function (e) {
      poly(el.fora, [[CXa + (xL + BAR - CXa) * e, Y0], [xL, Y0], [xL, Y1], [CXa + (xL + BAR - CXa) * e, Y1]]);
      poly(el.dentro, [[CXa + (xR - BAR - CXa) * e, Y0], [xR, Y0], [xR, Y1], [CXa + (xR - BAR - CXa) * e, Y1]]);
    }, 'abre', spring(1.1));
  }
  function place() {
    ['fora', 'dentro'].forEach(function (n) { poly(el[n], shift(GOAL[n], off[n])); });
    seg().setAttribute('transform', 'translate(' + off.seguro.toFixed(2) + ' 0)');
  }
  function spread(to, dur, curve) {                            /* colchetes e "Seguro" deslizam juntos */
    var from = copy(off);
    el.fora.style.visibility = el.dentro.style.visibility = '';
    tween(dur, function (e) {
      ['fora', 'dentro', 'seguro'].forEach(function (n) { off[n] = from[n] + (to[n] - from[n]) * e; });
      place();
    }, 'spread', curve || spring(.9));                          /* abrir e fechar com a mesma mola */
  }
  /* ---- volta ao começo, para o loop não ter emenda ----
     os colchetes se juntam de novo em quadrado, o quadrado afina e arredonda, e a linha se recolhe
     até o ponto de onde o triângulo nasce */
  function fecha(dur) {                                        /* barras crescem até se encontrarem no centro */
    tween(dur, function (e) {
      var f = 1 - e;
      poly(el.fora, [[CXa + (xL + BAR - CXa) * f, Y0], [xL, Y0], [xL, Y1], [CXa + (xL + BAR - CXa) * f, Y1]]);
      poly(el.dentro, [[CXa + (xR - BAR - CXa) * f, Y0], [xR, Y0], [xR, Y1], [CXa + (xR - BAR - CXa) * f, Y1]]);
    }, 'abre', spring(2.6));                                   /* as barras passam do centro e voltam, como ao abrir */
  }
  function afina(dur) {                                        /* vira o quadrado fino e arredondado */
    el.fora.style.visibility = el.dentro.style.visibility = 'hidden';
    quad.style.visibility = ''; quad.style.opacity = ''; quad.style.strokeDasharray = 'none'; quad.style.strokeDashoffset = '0';
    tween(dur, function (e) {
      quad.setAttribute('d', quadD(1 - .04 * Math.sin(Math.PI * e), R0 * e));
      quad.setAttribute('stroke-width', (W + (WF - W) * e).toFixed(2));
      quad.setAttribute('stroke-linejoin', e > .05 ? 'round' : 'miter');
      quad.setAttribute('stroke-linecap', 'round');
    }, 'afina');
  }
  function recolhe(dur) {                                      /* a linha se recolhe pelos dois lados até o ponto de partida */
    var s0 = quad.getTotalLength() ? (xR - R0) - (xL + R0) : 0; /* no caminho do quadrado, o ponto fica após a base */
    tween(dur, function (e) {
      win(quad, s0 * e, LQ - (LQ - s0) * e, LQ);
      if (e >= 1) { quad.style.opacity = '0'; ponto.style.opacity = '1'; raio(WF / 2, RP, 480, spring(4)); }   /* a bolinha recebe a linha com quique */
    }, 'recolhe');
  }
  /* borracha: zigue-zague da direita para a esquerda sobre a faixa das palavras, com passadas
     sobrepostas (a espessura do rabisco cobre o espaço entre elas) */
  var borracha = svg.querySelector('[data-borracha]');
  (function rabisco() {
    var x0 = 515, x1 = 30, top = 30, bot = 92, passo = 16, d = 'M' + x0 + ' ' + top, x = x0, cima = false;
    while (x > x1) { x -= passo; d += ' L' + x + ' ' + (cima ? top : bot); cima = !cima; }
    borracha.setAttribute('d', d);
    borracha.style.strokeDasharray = '1 2'; borracha.style.strokeDashoffset = '1';
  })();
  function apaga(dur) {
    var t0 = performance.now();
    cancelAnimationFrame(rafs.borracha);
    (function tick(now) {
      var t = Math.min(1, Math.max(0, (performance.now() - t0) / dur));
      borracha.style.strokeDashoffset = String(1 - soft(t));
      if (t < 1) { rafs.borracha = requestAnimationFrame(tick); return; }
      svg.classList.add('is-sai'); borracha.style.strokeDashoffset = '1';   /* apagado: a máscara volta limpa */
    })(t0);
  }
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  /* SEGURALTA vem do Figma como uma forma só, com 12 contornos. O traço reinicia a cada contorno,
     então as letras seriam traçadas todas juntas: separa em uma forma por letra (o furo do R e dos
     A fica com a sua letra, pela posição) para a palavra ser escrita da esquerda para a direita */
  (function separaLetras() {
    var word = svg.querySelectorAll('.lg-word--seguralta path')[2], ns = 'http://www.w3.org/2000/svg';
    var subs = word.getAttribute('d').split(/(?=M)/).filter(function (x) { return x.trim(); });
    var tmp = subs.map(function (d) {
      var el = document.createElementNS(ns, 'path'); el.setAttribute('d', d); word.parentNode.appendChild(el);
      var bb = el.getBBox(); word.parentNode.removeChild(el); return { d: d, bb: bb };
    });
    var inside = function (a, b) {                              /* contorno a dentro de b: é o furo de b */
      return a !== b && a.bb.x >= b.bb.x - .5 && a.bb.x + a.bb.width <= b.bb.x + b.bb.width + .5 &&
        a.bb.y >= b.bb.y - .5 && a.bb.y + a.bb.height <= b.bb.y + b.bb.height + .5 && a.bb.width < b.bb.width;
    };
    var letters = tmp.filter(function (c) { return !tmp.some(function (o) { return inside(c, o); }); })
      .map(function (outer) { return [outer].concat(tmp.filter(function (c) { return inside(c, outer); })); });
    letters.forEach(function (g) {
      var el = document.createElementNS(ns, 'path');
      el.setAttribute('d', g.map(function (c) { return c.d; }).join(''));
      el.setAttribute('fill', word.getAttribute('fill')); el.setAttribute('fill-rule', 'evenodd');
      word.parentNode.insertBefore(el, word);
    });
    word.parentNode.removeChild(word);
  })();
  /* cada forma das palavras recebe --i pela posição (esquerda para a direita): a cascata do CSS */
  ['.lg-word--seguro path', '.lg-word--seguralta path'].forEach(function (q) {
    Array.prototype.slice.call(svg.querySelectorAll(q))
      .map(function (p) { return [p, p.getBBox()]; })
      .sort(function (a, b) { return a[1].x - b[1].x || a[1].y - b[1].y; })
      .forEach(function (e, i) {
        e[0].style.setProperty('--i', i);
        e[0].setAttribute('pathLength', '1');                   /* o traço do contorno vai de 0 a 1 */
        e[0].setAttribute('stroke', e[0].getAttribute('fill')); /* contorno na cor da própria letra */
      });
  });
  function play(emenda) {                                      /* emenda: veio do fim do loop, o ponto já está na tela */
    timers.forEach(clearTimeout); timers = []; borracha.style.strokeDashoffset = '1';
    Object.keys(rafs).forEach(function (n) { cancelAnimationFrame(rafs[n]); });
    svg.className.baseVal = 'lg';
    layout();
    off = copy(pos.perto);
    seg().setAttribute('transform', 'translate(' + off.seguro.toFixed(2) + ' 0)');
    [el.fora, el.dentro].forEach(function (n) { n.setAttribute('stroke-width', W); });
    [tri, quad].forEach(function (n) {
      n.setAttribute('stroke-width', WF); n.setAttribute('stroke-linecap', 'round'); n.setAttribute('stroke-linejoin', 'round');
    });
    tri.setAttribute('d', triD());
    quad.setAttribute('d', quadD(1, R0));
    LT = tri.getTotalLength(); LQ = quad.getTotalLength(); S1 = LT + 2 * HB * .9;
    win(tri, 0, 0, LT); win(quad, 0, 0, LQ);
    tri.style.visibility = quad.style.visibility = ''; quad.style.opacity = '';
    el.fora.style.visibility = el.dentro.style.visibility = 'hidden';
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      tri.style.visibility = quad.style.visibility = 'hidden';
      el.fora.style.visibility = el.dentro.style.visibility = '';
      off = copy(pos.final); place(); ponto.style.opacity = '0'; ponto.setAttribute('r', 0);
      svg.classList.add('is-seguro', 'is-seguralta');
      return;
    }
    ponto.style.opacity = '1';                                 /* tudo começa no ponto, o mesmo em que a volta termina */
    if (emenda !== true) { ponto.setAttribute('r', 0); raio(0, RP, 420, spring(1.6)); }
    void svg.getBoundingClientRect();                          /* reinicia as transições */
    at(480,  function () { raio(RP, RP * 1.35, 170); });       /* a bolinha toma impulso... */
    at(650,  function () { raio(RP * 1.35, WF / 2, 300, spring(1.4)); });   /* ...e encolhe com quique até a ponta da linha, */
    at(900,  function () { desenha(2700); });                  /* 1. que sai dela: triângulo e quadrado */
    at(1000, function () { ponto.style.opacity = '0'; });
    at(3650, function () { assenta(1100); });                  /* 2. recolhe, expande (cantos retos, borda além) e assenta */
    at(4700, function () { abre(750); });                      /* 3. separa em "[ ]" */
    at(5200, function () { spread(pos.seguro, 800); });        /* 4. abrem com mola para "Seguro"... */
    at(5350, function () { svg.classList.add('is-seguro'); }); /*    ...que entra letra a letra */
    at(6250, function () { spread(pos.final, 950); });         /* 5. abrem mais para o resto da frase */
    at(6650, function () { svg.classList.add('is-seguralta'); });
    /* volta: logo parada por 1,5 s, depois o caminho inverso até o ponto, e recomeça */
    at(10500, function () { apaga(800); });                    /* 6. uma borracha apaga as palavras */
    at(11350, function () { spread(pos.perto, 650); });        /* 7. os colchetes se aproximam... */
    at(12050, function () { fecha(520); });                    /*    ...e se juntam no quadrado */
    at(12580, function () { afina(420); });                    /* 8. o quadrado afina e arredonda */
    at(12950, function () { recolhe(700); });                  /* 9. a linha se recolhe até o ponto */
    at(14200, function () { play(true); });                   /*    o ponto cresce e a próxima volta nasce dele */
  }
  document.querySelector('[data-logo-replay]').addEventListener('click', function () { play(); });
  play();
})();
